<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puantaj</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 45px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            background: #2563eb;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: white;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .logo h1 {
            margin-top: 15px;
            font-size: 30px;
        }

        .logo p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .option {
            width: 100%;
            border: none;
            background: white;
            border-radius: 20px;
            padding: 25px 22px;
            display: flex;
            align-items: center;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 17px;
        }

        .individual-icon {
            background: #dbeafe;
        }

        .corporate-icon {
            background: #dcfce7;
        }

        .option-text {
            flex: 1;
        }

        .option-text h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .option-text p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .arrow {
            font-size: 25px;
            color: #9ca3af;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            padding-top: 40px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 360px) {
            .container {
                padding: 20px 15px;
            }

            .logo {
                margin-top: 20px;
                margin-bottom: 35px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">📋</div>

        <h1>Puantaj</h1>

        <p>Çalışma takibinizi kolayca yönetin</p>
    </div>


    <div class="options">

        <!-- BİREYSEL -->
        <button class="option" onclick="bireysel()">

            <div class="option-icon individual-icon">
                👤
            </div>

            <div class="option-text">
                <h2>Bireysel</h2>

                <p>
                    Kendi çalışma günlerinizi,
                    ücretlerinizi ve puantajınızı takip edin.
                </p>
            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <!-- KURUMSAL -->
        <button class="option" onclick="kurumsal()">

            <div class="option-icon corporate-icon">
                🏢
            </div>

            <div class="option-text">
                <h2>Kurumsal</h2>

                <p>
                    Çalışanlarınızı, projelerinizi
                    ve şirket puantajınızı yönetin.
                </p>
            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>


    <div class="footer">
        Dijital Puantaj Sistemi
    </div>

</div>


<script>

function bireysel() {
    window.location.href = "bireysel.html";
}


function kurumsal() {

    alert("Kurumsal bölüm hazırlanıyor.");

}

</script>

</body>
</html>
