<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Bireysel Puantaj</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #cdbb94;
    color: #2b271f;
    overflow-x: hidden;
}


/* =========================
   ÜST BAR
========================= */

.topbar {
    height: 68px;
    background: #27231e;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.back-button {
    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: #454037;
    color: white;

    font-size: 27px;
}

.month-area {
    text-align: center;
}

.month-area strong {
    display: block;
    font-size: 19px;
}

.month-area span {
    font-size: 12px;
    color: #c9c5bd;
}

.month-buttons {
    display: flex;
    gap: 5px;
}

.month-buttons button {
    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 9px;

    background: #454037;
    color: white;

    font-size: 20px;
}


/* =========================
   DEFTER
========================= */

.book-area {
    padding: 10px 6px 25px;
}

.book {
    width: 100%;
    max-width: 1500px;
    margin: auto;

    background: #f4ecd8;

    border: 1px solid #a99b7a;
    border-radius: 4px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.28);

    overflow: hidden;
}


/* =========================
   DEFTER BAŞLIĞI
========================= */

.book-header {
    min-height: 90px;

    padding: 12px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80,60,30,.06) 0px,
            rgba(80,60,30,.06) 1px,
            transparent 1px,
            transparent 28px
        ),
        #f5edda;

    border-bottom: 3px solid #655d4c;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.book-title h1 {
    font-size: 21px;
    margin-bottom: 5px;
}

.book-title p {
    font-size: 12px;
    color: #6c6558;
}

.employee-count {
    background: #e4d8b9;

    padding: 9px 12px;

    border-radius: 9px;

    font-size: 11px;
    font-weight: bold;
}


/* =========================
   TABLO KAPSAYICI
========================= */

.table-scroll {
    width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    -webkit-overflow-scrolling: touch;
}


/* =========================
   TABLO
========================= */

table {
    border-collapse: collapse;

    /*
       1-31 günler + çalışan
       + ödeme alanları
    */

    min-width: 1510px;

    width: max-content;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80,60,30,.045) 0px,
            rgba(80,60,30,.045) 1px,
            transparent 1px,
            transparent 28px
        ),
        #f5edda;
}

th,
td {
    border: 1px solid #817864;

    text-align: center;

    height: 34px;

    padding: 0;
}


/* BAŞLIK */

th {
    background: rgba(120,105,75,.10);

    font-size: 10px;
    font-weight: bold;

    white-space: nowrap;
}


/* SÜTUNLAR */

.no-col {
    width: 42px;
    min-width: 42px;
}

.name-col {
    width: 160px;
    min-width: 160px;

    position: sticky;
    left: 0;

    z-index: 5;

    background: #f2e8ce;
}

.day-col {
    width: 31px;
    min-width: 31px;
}

.total-col {
    width: 100px;
    min-width: 100px;
}

.money-col {
    width: 105px;
    min-width: 105px;
}

.note-col {
    width: 150px;
    min-width: 150px;
}


/* =========================
   ÇALIŞAN ADI
========================= */

.worker-name {
    width: 100%;

    height: 32px;

    border: 0;

    outline: 0;

    background: transparent;

    padding: 5px 7px;

    font-size: 11px;
}


/* =========================
   PUANTAJ HÜCRELERİ
========================= */

.day-cell {
    cursor: pointer;

    user-select: none;

    font-size: 13px;

    font-weight: bold;
}

.day-cell:active {
    background: #d5c49c;
}


/* DURUMLAR */

.status-present {
    background: #dcebd8;
}

.status-absent {
    background: #f0caca;
}

.status-leave {
    background: #f0dfae;
}

.status-report {
    background: #d8e1ef;
}

.status-half {
    background: #e7d7bf;
}


/* =========================
   PARA INPUTLARI
========================= */

.money-input,
.note-input {
    width: 100%;

    height: 32px;

    border: 0;

    outline: 0;

    background: transparent;

    padding: 4px;

    text-align: center;

    font-size: 10px;
}

.note-input {
    text-align: left;
}


/* KALAN */

.balance {
    font-weight: bold;

    background: #eee3c6;
}


/* =========================
   ALT BİLGİ
========================= */

.info-area {
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80,60,30,.06) 0px,
            rgba(80,60,30,.06) 1px,
            transparent 1px,
            transparent 28px
        ),
        #f5edda;

    border-top: 2px solid #655d4c;

    padding: 12px;
}

.legend {
    display: flex;
    flex-wrap: wrap;

    gap: 8px;

    font-size: 10px;
}

.legend span {
    background: #e7dcc0;

    padding: 6px 8px;

    border-radius: 6px;

    border: 1px solid #c4b797;
}


/* =========================
   SAYFA KONTROLLERİ
========================= */

.controls {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    margin: 10px 0;
}

.controls button {
    border: 0;

    background: #29251f;

    color: white;

    padding: 11px 16px;

    border-radius: 10px;

    font-size: 13px;
}

.page-number {
    background: rgba(255,255,255,.65);

    padding: 10px 14px;

    border-radius: 9px;

    font-size: 12px;
}


/* =========================
   ÇALIŞAN EKLE
========================= */

.add-worker {
    text-align: center;

    margin-bottom: 20px;
}

.add-worker button {
    border: 1px solid #766c58;

    background: #eee3c6;

    padding: 11px 18px;

    border-radius: 10px;

    font-weight: bold;

    font-size: 14px;
}


/* =========================
   SAYFA GEÇİŞİ
========================= */

.page-animation {
    animation-duration: .35s;
    animation-fill-mode: both;
}

.slide-left {
    animation-name: slideLeft;
}

.slide-right {
    animation-name: slideRight;
}

@keyframes slideLeft {

    from {
        transform: translateX(8%);
        opacity: .3;
    }

    to {
        transform: translateX(0);
        opacity: 1;
    }

}

@keyframes slideRight {

    from {
        transform: translateX(-8%);
        opacity: .3;
    }

    to {
        transform: translateX(0);
        opacity: 1;
    }

}


/* =========================
   MOBİL
========================= */

@media (max-width: 600px) {

    .book-area {
        padding: 6px 3px 20px;
    }

    .book-header {
        min-height: 75px;
        padding: 9px;
    }

    .book-title h1 {
        font-size: 17px;
    }

    .book-title p {
        font-size: 10px;
    }

    .employee-count {
        font-size: 9px;
        padding: 7px 9px;
    }

    table {
        min-width: 1510px;
    }

    .controls button {
        padding: 10px 12px;
        font-size: 12px;
    }

}


/* =========================
   SAYFA İÇİNDEKİ AYRAÇ
========================= */

.page-label {
    text-align: center;

    font-size: 9px;

    color: #776e5c;

    padding: 7px;

    border-top: 1px solid #c4b797;
}

</style>
</head>


<body>


<!-- =========================
     ÜST BAR
========================= -->

<div class="topbar">

    <button
        class="back-button"
        onclick="goBack()">
        ‹
    </button>


    <div class="month-area">

        <strong id="monthTitle">
            Eylül 2026
        </strong>

        <span>
            Bireysel Puantaj Defteri
        </span>

    </div>


    <div class="month-buttons">

        <button onclick="changeMonth(-1)">
            ‹
        </button>

        <button onclick="changeMonth(1)">
            ›
        </button>

    </div>

</div>



<!-- =========================
     DEFTER
========================= -->

<div class="book-area">

<div class="book" id="book">


    <div class="book-header">

        <div class="book-title">

            <h1>
                AYLIK PUANTAJ
            </h1>

            <p>
                Çalışanların adı, günleri ve aylık ödemeleri
            </p>

        </div>


        <div class="employee-count">

            <span id="employeeCount">
                8 çalışan
            </span>

        </div>

    </div>


    <div id="tableContainer">

    </div>


    <div class="info-area">

        <div class="legend">

            <span>
                ✓ Çalıştı
            </span>

            <span>
                X Gelmedi
            </span>

            <span>
                İ İzin
            </span>

            <span>
                R Rapor
            </span>

            <span>
                ½ Yarım gün
            </span>

        </div>

    </div>


</div>

</div>



<!-- =========================
     SAYFA KONTROLLERİ
========================= -->

<div class="controls">

    <button onclick="previousPage()">
        ◀ Önceki
    </button>


    <div class="page-number">

        Sayfa
        <span id="pageNumber">1</span>
        /
        <span id="pageTotal">1</span>

    </div>


    <button onclick="nextPage()">
        Sonraki ▶
    </button>

</div>



<!-- =========================
     ÇALIŞAN EKLE
========================= -->

<div class="add-worker">

    <button onclick="addWorker()">
        ＋ Çalışan Ekle
    </button>

</div>



<script>


/* =========================
   AY
========================= */

let currentDate =
    new Date(2026, 8, 1);


const monthNames = [

    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"

];


function updateMonth() {

    document.getElementById(
        "monthTitle"
    ).textContent =

        monthNames[
            currentDate.getMonth()
        ]

        + " " +

        currentDate.getFullYear();

}



/* =========================
   ÇALIŞANLAR
========================= */

let workers = [

    {
        name: "Edip Tan",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 2",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 3",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 4",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 5",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 6",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 7",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    },

    {
        name: "Çalışan 8",
        days: {},
        total: "",
        salary: "",
        received: "",
        note: ""
    }

];



/* =========================
   SAYFA
========================= */

/*
   Bir sayfada 8 çalışan.
   Daha fazla çalışan olursa
   sonraki defter sayfasına geçer.
*/

const workersPerPage = 8;

let currentPage = 1;


function totalPages() {

    return Math.max(
        1,
        Math.ceil(
            workers.length /
            workersPerPage
        )
    );

}



/* =========================
   TABLOYU OLUŞTUR
========================= */

function renderTable(animation = "") {

    const container =
        document.getElementById(
            "tableContainer"
        );


    const start =
        (currentPage - 1) *
        workersPerPage;


    const end =
        Math.min(
            start + workersPerPage,
            workers.length
        );


    let html = `

    <div class="${animation}">

    <div class="table-scroll">

    <table>

        <thead>

            <tr>

                <th class="no-col">
                    Sıra No
                </th>

                <th class="name-col">
                    Çalışanın Adı - Soyadı
                </th>
    `;


    /* 1-31 */

    for(let day = 1; day <= 31; day++) {

        html += `

            <th class="day-col">
                ${day}
            </th>

        `;

    }


    html += `

                <th class="total-col">
                    Saat / Yevmiye<br>
                    Toplamı
                </th>

                <th class="money-col">
                    Ücreti
                </th>

                <th class="money-col">
                    Alınan
                </th>

                <th class="money-col">
                    Kalan
                </th>

                <th class="note-col">
                    Not
                </th>

            </tr>

        </thead>

        <tbody>

    `;


    /* ÇALIŞANLAR */

    for(let i = start; i < end; i++) {

        const worker =
            workers[i];


        html += `

        <tr>

            <td class="no-col">
                ${i + 1}
            </td>


            <td class="name-col">

                <input
                    class="worker-name"
                    value="${escapeHtml(worker.name)}"
                    onchange="updateName(${i}, this.value)">

            </td>

        `;


        /* GÜNLER */

        for(let day = 1; day <= 31; day++) {

            const status =
                worker.days[day] || "";


            let statusClass =
                getStatusClass(status);


            html += `

                <td
                    class="day-col day-cell ${statusClass}"
                    onclick="changeDay(${i}, ${day})">

                    ${status}

                </td>

            `;

        }


        /* TOPLAM */

        html += `

            <td>

                <input
                    class="money-input"
                    value="${escapeHtml(worker.total)}"
                    placeholder="0"
                    onchange="updateField(${i}, 'total', this.value)">

            </td>


            <td>

                <input
                    class="money-input"
                    value="${escapeHtml(worker.salary)}"
                    placeholder="0 TL"
                    onchange="updateField(${i}, 'salary', this.value); calculateBalance(${i})">

            </td>


            <td>

                <input
                    class="money-input"
                    value="${escapeHtml(worker.received)}"
                    placeholder="0 TL"
                    onchange="updateField(${i}, 'received', this.value); calculateBalance(${i})">

            </td>


            <td
                id="balance-${i}"
                class="balance">

                ${calculateBalanceValue(worker)}

            </td>


            <td>

                <input
                    class="note-input"
                    value="${escapeHtml(worker.note)}"
                    placeholder="Not"
                    onchange="updateField(${i}, 'note', this.value)">

            </td>

        </tr>

        `;

    }


    html += `

        </tbody>

    </table>

    </div>

    </div>

    `;


    container.innerHTML = html;


    document.getElementById(
        "employeeCount"
    ).textContent =
        workers.length + " çalışan";


    document.getElementById(
        "pageNumber"
    ).textContent =
        currentPage;


    document.getElementById(
        "pageTotal"
    ).textContent =
        totalPages();

}



/* =========================
   DURUM DEĞİŞTİR
========================= */

const statusList = [

    "",
    "✓",
    "X",
    "İ",
    "R",
    "½"

];


function changeDay(workerIndex, day) {

    let worker =
        workers[workerIndex];


    let current =
        worker.days[day] || "";


    let index =
        statusList.indexOf(current);


    index++;


    if(index >= statusList.length) {

        index = 0;

    }


    worker.days[day] =
        statusList[index];


    saveData();

    renderTable();

}



/* =========================
   RENK
========================= */

function getStatusClass(status) {

    if(status === "✓")
        return "status-present";

    if(status === "X")
        return "status-absent";

    if(status === "İ")
        return "status-leave";

    if(status === "R")
        return "status-report";

    if(status === "½")
        return "status-half";

    return "";

}



/* =========================
   İSİM
========================= */

function updateName(index, value) {

    workers[index].name =
        value;

    saveData();

}



/* =========================
   ALAN GÜNCELLE
========================= */

function updateField(
    index,
    field,
    value
) {

    workers[index][field] =
        value;

    saveData();

}



/* =========================
   KALAN HESABI
========================= */

function calculateBalanceValue(
    worker
) {

    let salary =
        parseFloat(
            String(worker.salary)
                .replace(",", ".")
                .replace(/[^\d.-]/g, "")
        ) || 0;


    let received =
        parseFloat(
            String(worker.received)
                .replace(",", ".")
                .replace(/[^\d.-]/g, "")
        ) || 0;


    let balance =
        salary - received;


    if(
        worker.salary === "" &&
        worker.received === ""
    ) {

        return "0 TL";

    }


    return formatMoney(balance);

}


function calculateBalance(index) {

    const element =
        document.getElementById(
            "balance-" + index
        );


    if(!element) return;


    element.textContent =
        calculateBalanceValue(
            workers[index]
        );



    saveData();

}


function formatMoney(value) {

    return value.toLocaleString(
        "tr-TR",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    ) + " TL";

}



/* =========================
   ÇALIŞAN EKLE
========================= */

function addWorker() {

    workers.push({

        name:
            "Çalışan " +
            (workers.length + 1),

        days: {},

        total: "",

        salary: "",

        received: "",

        note: ""

    });


    currentPage =
        totalPages();


    saveData();

    renderTable(
        "page-animation slide-left"
    );

}



/* =========================
   SAYFA DEĞİŞTİR
========================= */

function nextPage() {

    if(
        currentPage <
        totalPages()
    ) {

        currentPage++;

        renderTable(
            "page-animation slide-left"
        );

    }

}


function previousPage() {

    if(
        currentPage > 1
    ) {

        currentPage--;

        renderTable(
            "page-animation slide-right"
        );

    }

}



/* =========================
   AY DEĞİŞTİR
========================= */

function changeMonth(amount) {

    saveData();


    currentDate.setMonth(
        currentDate.getMonth() +
        amount
    );


    updateMonth();

}



/* =========================
   VERİ KAYDET
========================= */

function saveData() {

    const key =
        "puantaj_" +
        currentDate.getFullYear() +
        "_" +
        currentDate.getMonth();


    localStorage.setItem(
        key,
        JSON.stringify(workers)
    );

}



/* =========================
   VERİ YÜKLE
========================= */

function loadData() {

    const key =
        "puantaj_" +
        currentDate.getFullYear() +
        "_" +
        currentDate.getMonth();


    const saved =
        localStorage.getItem(key);


    if(saved) {

        try {

            workers =
                JSON.parse(saved);

        } catch(error) {

            console.log(
                "Kayıt okunamadı."
            );

        }

    }

}



/* =========================
   GÜVENLİ METİN
========================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}



/* =========================
   GERİ
========================= */

function goBack() {

    window.location.href =
        "index.html";

}



/* =========================
   TELEFONDA SAYFA KAYDIRMA
========================= */

let touchStartX = 0;


const book =
    document.getElementById("book");


book.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    { passive: true }
);


book.addEventListener(
    "touchend",
    function(event) {

        const touchEndX =
            event.changedTouches[0]
                .screenX;


        const distance =
            touchEndX -
            touchStartX;


        /*
          Tablo üzerinde yatay kaydırma
          yapılırken sayfa değiştirme.
        */

        if(
            Math.abs(distance) < 100
        ) {

            return;

        }


        if(
            distance < 0
        ) {

            nextPage();

        }
        else {

            previousPage();

        }

    },
    { passive: true }
);



/* =========================
   BAŞLAT
========================= */

updateMonth();

loadData();

renderTable();

</script>

</body>
</html>
