<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bireysel Puantaj Defteri</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #cdbb94;
    font-family: Arial, sans-serif;
    color: #2d281f;
    overflow-x: hidden;
}

/* ÜST BAR */

.topbar {
    height: 68px;
    background: #27231d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
}

.topbar button {
    border: 0;
    background: #454037;
    color: white;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    font-size: 25px;
}

.title {
    text-align: center;
}

.title strong {
    display: block;
    font-size: 19px;
}

.title span {
    font-size: 12px;
    color: #c9c5bd;
}


/* DEFTER */

.book-area {
    padding: 12px 7px 25px;
}

.book {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,.28);
}


/* SAYFA */

.page {
    width: 100%;
    min-height: calc(100vh - 120px);

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(80,60,30,.07) 0px,
            rgba(80,60,30,.07) 1px,
            transparent 1px,
            transparent 27px
        ),
        #f5edda;

    border: 1px solid #a99b7a;

    position: relative;
    overflow: hidden;
}


/* SAYFA İÇİ */

.page-inner {
    width: 100%;
}


/* ÜST BİLGİ */

.info {
    display: grid;
    grid-template-columns: 45px 1fr;
    border-bottom: 2px solid #655d4c;
    height: 76px;
}

.info-number {
    border-right: 1px solid #77705f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: bold;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
}

.info-name {
    padding: 10px 12px;
}

.info-name strong {
    font-size: 12px;
}

.info-name input {
    display: block;
    width: 100%;
    margin-top: 9px;
    border: 0;
    border-bottom: 1px solid #777;
    background: transparent;
    outline: none;
    font-size: 15px;
}


/* TABLO */

.table-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

table {
    border-collapse: collapse;
    min-width: 760px;
    width: 100%;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #817864;
    text-align: center;
    height: 28px;
    font-size: 9px;
    padding: 0;
}

th {
    background: rgba(120,105,75,.08);
    font-weight: bold;
}

.no {
    width: 35px;
}

.name {
    width: 135px;
}

.day {
    width: 25px;
}

.worker-input {
    width: 100%;
    height: 27px;
    border: 0;
    outline: 0;
    padding: 3px;
    background: transparent;
    font-size: 10px;
}


/* GÜN HÜCRESİ */

.cell {
    cursor: pointer;
    user-select: none;
    font-weight: bold;
}

.cell:active {
    background: #d5c49c;
}

.c1 {
    background: #dcebd8;
}

.c2 {
    background: #f1cccc;
}

.c3 {
    background: #f0dfae;
}

.c4 {
    background: #d8e1ef;
}

.c5 {
    background: #e7d7bf;
}


/* SAĞ SAYFA */

.right-layout {
    display: grid;
    grid-template-columns: 1fr 145px;
}

.right-days {
    overflow-x: auto;
}

.right-summary {
    border-left: 2px solid #655d4c;
    min-width: 145px;
}

.summary-title {
    height: 28px;
    border-bottom: 1px solid #817864;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: bold;
}

.summary-line {
    min-height: 48px;
    border-bottom: 1px solid #817864;
    padding: 5px;
    font-size: 8px;
}

.summary-line strong {
    display: block;
    margin-bottom: 4px;
}

.summary-line input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid #777;
    background: transparent;
    outline: none;
    font-size: 11px;
}


/* NOT */

.note {
    border-top: 1px solid #817864;
    padding: 7px;
    height: 95px;
}

.note strong {
    font-size: 9px;
}

.note textarea {
    width: 100%;
    height: 65px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 11px;
}


/* SAYFA KONTROL */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
}

.controls button {
    background: #29251f;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 10px 15px;
    font-size: 14px;
}

.page-count {
    background: rgba(255,255,255,.6);
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 12px;
}


/* ÇALIŞAN EKLE */

.add {
    text-align: center;
    margin-top: 9px;
}

.add button {
    border: 1px solid #6f654f;
    background: #eee3c5;
    padding: 9px 15px;
    border-radius: 9px;
    font-weight: bold;
}


/* SAYFA GEÇİŞİ */

.page-container {
    transition: transform .35s ease, opacity .35s ease;
}

.slide-left {
    transform: translateX(-8%);
    opacity: .2;
}

.slide-right {
    transform: translateX(8%);
    opacity: .2;
}


/* MOBİL */

@media (max-width: 700px) {

    .book-area {
        padding: 8px 4px;
    }

    .page {
        min-height: calc(100vh - 110px);
    }

    .right-layout {
        grid-template-columns: 1fr 125px;
    }

    .right-summary {
        min-width: 125px;
    }

    .summary-line {
        font-size: 7px;
    }

    .summary-line input {
        font-size: 10px;
    }

}
</style>
</head>

<body>


<!-- ÜST BAR -->

<div class="topbar">

    <button onclick="goBack()">‹</button>

    <div class="title">
        <strong id="monthTitle">Eylül 2026</strong>
        <span>Bireysel Puantaj Defteri</span>
    </div>

    <div>
        <button onclick="previousMonth()">‹</button>
        <button onclick="nextMonth()">›</button>
    </div>

</div>


<!-- DEFTER -->

<div class="book-area">

    <div class="book">

        <div id="pageContainer">

            <!-- SAYFA BURAYA GELECEK -->

        </div>

    </div>

</div>


<!-- KONTROLLER -->

<div class="controls">

    <button onclick="previousPage()">
        ◀ Önceki
    </button>

    <div class="page-count">
        Sayfa <span id="pageNumber">1</span> / 2
    </div>

    <button onclick="nextPage()">
        Sonraki ▶
    </button>

</div>


<div class="add">
    <button onclick="addWorker()">
        ＋ Çalışan Ekle
    </button>
</div>


<script>

/* =========================
   AY
========================= */

let date = new Date(2026, 8, 1);

const monthNames = [
    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"
];

function updateMonth() {

    document.getElementById("monthTitle").textContent =
        monthNames[date.getMonth()] +
        " " +
        date.getFullYear();

}

function previousMonth() {

    date.setMonth(date.getMonth() - 1);

    updateMonth();

}

function nextMonth() {

    date.setMonth(date.getMonth() + 1);

    updateMonth();

}


/* =========================
   ÇALIŞANLAR
========================= */

let workers = [
    "Çalışan 1",
    "Çalışan 2",
    "Çalışan 3",
    "Çalışan 4",
    "Çalışan 5",
    "Çalışan 6",
    "Çalışan 7",
    "Çalışan 8"
];

function addWorker() {

    workers.push(
        "Çalışan " + (workers.length + 1)
    );

    render();

}


/* =========================
   DURUMLAR
========================= */

const statuses = [
    "",
    "✓",
    "X",
    "İ",
    "R",
    "½"
];

const classes = [
    "",
    "c1",
    "c2",
    "c3",
    "c4",
    "c5"
];

function changeStatus(cell) {

    let value =
        Number(cell.dataset.value || 0);

    value++;

    if (value >= statuses.length) {
        value = 0;
    }

    cell.dataset.value = value;

    cell.textContent =
        statuses[value];

    cell.className =
        "cell " + classes[value];

}


/* =========================
   SOL SAYFA
========================= */

function createLeftPage() {

    let html = `

    <div class="page">

        <div class="page-inner">

            <div class="info">

                <div class="info-number">
                    SIRA NO
                </div>

                <div class="info-name">

                    <strong>
                        ÇALIŞANLARIN ADI - SOYADI
                    </strong>

                    <input
                        placeholder="Çalışan / kişi adı">

                </div>

            </div>


            <div class="table-scroll">

                <table>

                    <thead>

                        <tr>

                            <th class="no">
                                Sıra
                            </th>

                            <th class="name">
                                Çalışanın Adı - Soyadı
                            </th>

    `;

    for(let day = 1; day <= 19; day++) {

        html += `
            <th class="day">
                ${day}
            </th>
        `;

    }

    html += `

                        </tr>

                    </thead>

                    <tbody>
    `;


    workers.forEach((worker, index) => {

        html += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <input
                        class="worker-input"
                        value="${worker}">
                </td>

        `;

        for(let day = 1; day <= 19; day++) {

            html += `
                <td
                    class="cell"
                    onclick="changeStatus(this)">
                </td>
            `;

        }

        html += `

            </tr>

        `;

    });


    html += `

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    `;

    return html;

}


/* =========================
   SAĞ SAYFA
========================= */

function createRightPage() {

    let html = `

    <div class="page">

        <div class="info">

            <div class="info-number">
                AYLIK
            </div>

            <div class="info-name">

                <strong>
                    AYLIK PUANTAJ
                </strong>

            </div>

        </div>


        <div class="right-layout">

            <div class="right-days">

                <table>

                    <thead>

                        <tr>

                            <th class="no">
                                No
                            </th>

    `;


    for(let day = 20; day <= 31; day++) {

        html += `
            <th class="day">
                ${day}
            </th>
        `;

    }


    html += `

                        </tr>

                    </thead>

                    <tbody>

    `;


    workers.forEach((worker, index) => {

        html += `

            <tr>

                <td>
                    ${index + 1}
                </td>

        `;


        for(let day = 20; day <= 31; day++) {

            html += `
                <td
                    class="cell"
                    onclick="changeStatus(this)">
                </td>
            `;

        }


        html += `

            </tr>

        `;

    });


    html += `

                    </tbody>

                </table>

            </div>


            <div class="right-summary">

                <div class="summary-title">
                    ÖZET
                </div>

                <div class="summary-line">
                    <strong>
                        Saat veya yevmiyeleri toplamı
                    </strong>

                    <input placeholder="0">
                </div>

                <div class="summary-line">
                    <strong>
                        Ücreti
                    </strong>

                    <input placeholder="0 TL">
                </div>

                <div class="summary-line">
                    <strong>
                        Tediye edilecek meblağ
                    </strong>

                    <input placeholder="0 TL">
                </div>

                <div class="summary-line">
                    <strong>
                        Avans
                    </strong>

                    <input placeholder="0 TL">
                </div>

                <div class="summary-line">
                    <strong>
                        Tediye olunacak bakiye
                    </strong>

                    <input placeholder="0 TL">
                </div>

            </div>

        </div>


        <div class="note">

            <strong>
                Not
            </strong>

            <textarea
                placeholder="Not yazabilirsiniz..."></textarea>

        </div>

    </div>

    `;

    return html;

}


/* =========================
   SAYFA SİSTEMİ
========================= */

let page = 1;

function render() {

    const container =
        document.getElementById("pageContainer");

    if(page === 1) {

        container.innerHTML =
            createLeftPage();

    } else {

        container.innerHTML =
            createRightPage();

    }

    document.getElementById("pageNumber")
        .textContent = page;

}


function nextPage() {

    if(page < 2) {

        const container =
            document.getElementById("pageContainer");

        container.classList.add("slide-left");

        setTimeout(() => {

            page = 2;

            render();

            container.classList.remove(
                "slide-left"
            );

        }, 180);

    }

}


function previousPage() {

    if(page > 1) {

        const container =
            document.getElementById("pageContainer");

        container.classList.add("slide-right");

        setTimeout(() => {

            page = 1;

            render();

            container.classList.remove(
                "slide-right"
            );

        }, 180);

    }

}


/* =========================
   PARMAKLA SAYFA ÇEVİRME
========================= */

let startX = 0;
let endX = 0;

const book =
    document.querySelector(".book");

book.addEventListener(
    "touchstart",
    function(e) {

        startX =
            e.changedTouches[0].screenX;

    },
    { passive: true }
);


book.addEventListener(
    "touchend",
    function(e) {

        endX =
            e.changedTouches[0].screenX;

        let distance =
            endX - startX;

        if(Math.abs(distance) < 60) {
            return;
        }

        if(distance < 0) {

            nextPage();

        } else {

            previousPage();

        }

    },
    { passive: true }
);


/* GERİ */

function goBack() {

    window.location.href =
        "index.html";

}


/* BAŞLAT */

updateMonth();

render();

</script>

</body>
</html>
