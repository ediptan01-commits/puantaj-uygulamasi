<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bireysel Puantaj</title>

<style>

/* ==================================================
   TEMEL
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

    background:#d8c7a5;

    color:#352e25;

    min-height:100vh;
}


/* ==================================================
   ÜST BAR
================================================== */

.top{
    height:72px;

    background:#f5ecd8;

    border-bottom:1px solid #b8a984;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;
}

.back{
    width:44px;
    height:44px;

    border:0;

    background:transparent;

    color:#40372b;

    font-size:38px;
}

.title{
    text-align:center;
}

.title b{
    display:block;

    font-size:20px;
}

.title span{
    font-size:12px;

    color:#7b705e;
}


/* ==================================================
   ÇALIŞANLAR ÜST BÖLÜMÜ
================================================== */

.employeeBar{

    background:#eee4ce;

    border-bottom:1px solid #b8a984;

    padding:9px 10px;

    display:flex;

    align-items:center;

    gap:7px;

    overflow-x:auto;

    scrollbar-width:none;
}

.employeeBar::-webkit-scrollbar{
    display:none;
}


/* Çalışan adı */

.employeeChip{

    flex:0 0 auto;

    border:1px solid #b8a984;

    background:#e0d1b1;

    color:#5d5140;

    border-radius:20px;

    padding:8px 13px;

    font-size:13px;

    white-space:nowrap;

    cursor:pointer;
}


/* Aktif çalışan */

.employeeChip.active{

    background:#c9b58b;

    color:#2f281f;

    border-color:#9e8a62;

    font-weight:bold;

}


/* Artı */

.addEmployeeTop{

    flex:0 0 auto;

    width:38px;

    height:38px;

    border-radius:50%;

    border:1px solid #aa9975;

    background:#f4ead5;

    color:#4a3e2e;

    font-size:22px;

    cursor:pointer;
}


/* ==================================================
   ANA
================================================== */

.main{

    width:100%;

    max-width:760px;

    margin:auto;
}


/* ==================================================
   AY
================================================== */

.monthBar{

    padding:22px 15px 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.monthName{

    font-size:30px;

    font-weight:bold;
}

.monthButtons{

    display:flex;

    gap:8px;
}

.monthButtons button{

    width:45px;

    height:45px;

    border:1px solid #b6a47f;

    border-radius:12px;

    background:#eee2c6;

    color:#443b2e;

    font-size:28px;
}


/* ==================================================
   SEKME
================================================== */

.tabs{

    margin:0 14px 17px;

    height:52px;

    border-radius:28px;

    background:#c7b58f;

    padding:4px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);
}

.tab{

    border:0;

    background:transparent;

    border-radius:25px;

    color:#665d4d;

    font-size:14px;
}

.tab.active{

    background:#f5ecd8;

    color:#30291f;

    font-weight:bold;

    box-shadow:
        0 2px 5px rgba(0,0,0,.12);
}


/* ==================================================
   HAFTA
================================================== */

.weekdays{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    background:#e2d4b5;

    border-top:1px solid #b9a780;

    border-bottom:1px solid #b9a780;
}

.weekday{

    text-align:center;

    padding:11px 0;

    font-size:13px;

    font-weight:bold;

    color:#40382d;
}

.weekend{
    color:#817664;
}


/* ==================================================
   TAKVİM
================================================== */

.calendar{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    background:#d5c39e;
}

.day{

    min-height:94px;

    background:#eee5d0;

    border-right:1px solid #c0ae8b;

    border-bottom:1px solid #c0ae8b;

    padding-top:8px;

    text-align:center;

    cursor:pointer;

    position:relative;
}

.day:nth-child(7n+1){

    border-left:1px solid #c0ae8b;
}


/* Gün numarası */

.dayNumber{

    width:36px;

    height:36px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    font-size:18px;

    font-weight:bold;

    color:#3c3429;
}


/* Bugün */

.today .dayNumber{

    background:#d96742;

    color:white;
}


/* Diğer ay */

.otherMonth{

    background:#ddd1b5;

    cursor:default;
}

.otherMonth .dayNumber{

    color:#9a8d76;
}


/* ==================================================
   DURUMLAR
================================================== */

.status{

    margin-top:7px;

    font-size:12px;

    font-weight:bold;

    line-height:16px;
}


/* Çalıştı */

.worked{

    background:#dfead7;
}

.workedStatus{

    color:#4d894b;
}


/* Gelmedi */

.absent{

    background:#f0d8d5;
}

.absentStatus{

    color:#c44f49;
}


/* İzinli */

.leave{

    background:#e6dfce;
}

.leaveStatus{

    color:#776a51;
}


/* Raporlu */

.report{

    background:#e4d9eb;
}

.reportStatus{

    color:#755798;
}


/* Yarım */

.half{

    background:#f0e1c8;
}

.halfStatus{

    color:#b67530;
}


/* ==================================================
   KART
================================================== */

.card{

    margin:16px 12px;

    background:#f0e6d0;

    border:1px solid #bcae91;

    border-radius:18px;

    padding:17px;

    box-shadow:
        0 3px 8px rgba(80,60,30,.08);
}

.cardTitle{

    font-size:21px;

    font-weight:bold;

    margin-bottom:13px;
}


/* ==================================================
   ÖZET
================================================== */

.summaryGrid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}

.box{

    background:#e3d5b7;

    border-radius:12px;

    padding:12px;
}

.box small{

    display:block;

    color:#786d5b;

    font-size:11px;

    margin-bottom:6px;
}

.box strong{

    font-size:18px;
}


/* ==================================================
   ÖDEME
================================================== */

.paymentGrid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}

.paymentBox{

    background:#e3d5b7;

    border-radius:12px;

    padding:12px;
}

.paymentBox label{

    display:block;

    color:#786d5b;

    font-size:11px;

    margin-bottom:6px;
}

.paymentBox input{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    color:#332d23;

    font-size:17px;
}

.balanceBox{

    grid-column:1 / 3;
}

.balance{

    font-size:19px;

    font-weight:bold;
}


/* ==================================================
   ÇALIŞAN EKLEME PENCERESİ
================================================== */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(45,38,28,.45);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:.2s;

    z-index:9999;
}

.modal.show{

    opacity:1;

    visibility:visible;

    pointer-events:auto;
}

.modalBox{

    width:100%;

    max-width:390px;

    background:#f4ead4;

    border:1px solid #b9a984;

    border-radius:20px;

    padding:22px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.25);
}

.modalTitle{

    font-size:23px;

    font-weight:bold;

    color:#352e25;

    margin-bottom:7px;
}

.modalText{

    font-size:13px;

    color:#776b58;

    margin-bottom:16px;
}

.employeeInput{

    width:100%;

    height:52px;

    border:1px solid #b9a984;

    border-radius:12px;

    background:#e7dac0;

    color:#352e25;

    outline:none;

    padding:0 14px;

    font-size:16px;
}

.employeeInput:focus{

    border-color:#8f7d58;

    background:#eee4ce;
}

.modalButtons{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:18px;
}

.modalButtons button{

    border:0;

    border-radius:11px;

    padding:12px 20px;

    font-size:15px;

    font-weight:bold;
}

.cancelButton{

    background:#ddd0b4;

    color:#554b3c;
}

.saveEmployeeButton{

    background:#d8a36c;

    color:#30271d;
}


/* ==================================================
   TELEFON
================================================== */

@media(max-width:500px){

    .monthName{

        font-size:28px;
    }

    .day{

        min-height:88px;
    }

    .dayNumber{

        width:33px;

        height:33px;

        font-size:17px;
    }

    .status{

        font-size:11px;
    }

}

   /* ==========================================
   KOMPAKT TELEFON GÖRÜNÜMÜ
========================================== */

@media (max-width: 600px){

    /* Üst başlık */
    .top{
        height:54px;
        padding:0 8px;
    }

    .back{
        width:34px;
        height:34px;
        font-size:30px;
    }

    .title b{
        font-size:17px;
    }

    .title span{
        font-size:10px;
    }


    /* Çalışan isimleri */
    .employeeBar{
        padding:5px 7px;
        gap:5px;
    }

    .employeeChip{
        padding:6px 10px;
        font-size:11px;
    }

    .addEmployeeTop{
        width:31px;
        height:31px;
        font-size:18px;
    }


    /* Ay başlığı */
    .monthBar{
        padding:10px 10px 8px;
    }

    .monthName{
        font-size:24px;
    }

    .monthButtons{
        gap:5px;
    }

    .monthButtons button{
        width:35px;
        height:35px;
        font-size:22px;
        border-radius:9px;
    }


    /* Sekmeler */
    .tabs{
        height:39px;
        margin:0 8px 8px;
        padding:3px;
    }

    .tab{
        font-size:12px;
    }


    /* Haftanın günleri */
    .weekday{
        padding:7px 0;
        font-size:11px;
    }


    /* Takvim */
    .day{
        min-height:63px;
        padding-top:4px;
    }

    .dayNumber{
        width:27px;
        height:27px;
        font-size:14px;
    }

    .status{
        margin-top:3px;
        font-size:9px;
        line-height:11px;
    }


    /* Özet kartı */
    .card{
        margin:8px 8px;
        padding:10px;
        border-radius:13px;
    }

    .cardTitle{
        font-size:16px;
        margin-bottom:7px;
    }


    /* Özet kutuları */
    .summaryGrid{
        gap:5px;
    }

    .box{
        padding:7px;
        border-radius:8px;
    }

    .box small{
        font-size:9px;
        margin-bottom:3px;
    }

    .box strong{
        font-size:14px;
    }


    /* Ödeme */
    .paymentGrid{
        gap:5px;
    }

    .paymentBox{
        padding:7px;
        border-radius:8px;
    }

    .paymentBox label{
        font-size:9px;
        margin-bottom:3px;
    }

    .paymentBox input{
        font-size:14px;
    }

    .balance{
        font-size:15px;
    }


    /* Çalışan ekleme penceresi */
    .modalBox{
        max-width:330px;
        padding:17px;
        border-radius:16px;
    }

    .modalTitle{
        font-size:19px;
    }

    .modalText{
        font-size:11px;
        margin-bottom:10px;
    }

    .employeeInput{
        height:45px;
        font-size:14px;
    }

    .modalButtons{
        margin-top:12px;
    }

    .modalButtons button{
        padding:9px 15px;
        font-size:13px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     ANA EKRAN
================================================== -->

<div id="calendarScreen"
class="main">


    <!-- ÜST -->

    <div class="top">


        <button
        class="back"
        onclick="goBack()">

            ‹

        </button>


        <div class="title">

            <b id="employeeName"></b>

            <span>
                Puantaj
            </span>

        </div>


        <div
        style="width:44px">
        </div>


    </div>


    <!-- ==================================================
         ÇALIŞAN İSİMLERİ
    ================================================== -->

    <div
    id="employeeBar"
    class="employeeBar">
    </div>


    <!-- ==================================================
         AY
    ================================================== -->

    <div class="monthBar">


        <div
        id="monthName"
        class="monthName">
        </div>


        <div class="monthButtons">


            <button
            onclick="changeMonth(-1)">

                ‹

            </button>


            <button
            onclick="changeMonth(1)">

                ›

            </button>


        </div>


    </div>


    <!-- ==================================================
         SEKMELER
    ================================================== -->

    <div class="tabs">


        <button class="tab">
            Yıl
        </button>


        <button
        class="tab active">

            Ay

        </button>


        <button class="tab">
            Hafta
        </button>


        <button class="tab">
            Gün
        </button>


    </div>


    <!-- ==================================================
         HAFTA GÜNLERİ
    ================================================== -->

    <div class="weekdays">


        <div class="weekday">
            PZT
        </div>


        <div class="weekday">
            SAL
        </div>


        <div class="weekday">
            ÇAR
        </div>


        <div class="weekday">
            PER
        </div>


        <div class="weekday">
            CUM
        </div>


        <div class="weekday weekend">
            CMT
        </div>


        <div class="weekday weekend">
            PAZ
        </div>


    </div>


    <!-- ==================================================
         TAKVİM
    ================================================== -->

    <div
    id="calendar"
    class="calendar">
    </div>


    <!-- ==================================================
         ÖZET
    ================================================== -->

    <div class="card">


        <div class="cardTitle">
            Aylık Özet
        </div>


        <div class="summaryGrid">


            <div class="box">

                <small>
                    Çalışılan Gün
                </small>

                <strong id="worked">
                    0
                </strong>

            </div>


            <div class="box">

                <small>
                    Toplam Saat
                </small>

                <strong id="hours">
                    0 saat
                </strong>

            </div>


            <div class="box">

                <small>
                    Toplam Yevmiye
                </small>

                <strong id="wage">
                    0
                </strong>

            </div>


            <div class="box">

                <small>
                    Gelinmeyen Gün
                </small>

                <strong id="absent">
                    0
                </strong>

            </div>


        </div>

    </div>


    <!-- ==================================================
         ÖDEME
    ================================================== -->

    <div class="card">


        <div class="cardTitle">
            Aylık Ödeme
        </div>


        <div class="paymentGrid">


            <div class="paymentBox">

                <label>
                    Ücreti
                </label>

                <input
                id="salary"
                type="number"
                placeholder="0"
                oninput="paymentChanged()">

            </div>


            <div class="paymentBox">

                <label>
                    Alınan
                </label>

                <input
                id="received"
                type="number"
                placeholder="0"
                oninput="paymentChanged()">

            </div>


            <div
            class="paymentBox balanceBox">

                <label>
                    Kalan
                </label>

                <div
                id="balance"
                class="balance">

                    0 TL

                </div>

            </div>


        </div>

    </div>


</div>



<!-- ==================================================
     ÇALIŞAN EKLEME MODALI
================================================== -->

<div
id="addEmployeeModal"
class="modal">


    <div class="modalBox">


        <div class="modalTitle">
            Yeni Çalışan
        </div>


        <div class="modalText">

            Çalışanın adı ve soyadını girin

        </div>


        <input
        id="employeeNameInput"
        class="employeeInput"
        type="text"
        placeholder="Ad Soyad"
        autocomplete="off">


        <div class="modalButtons">


            <button
            class="cancelButton"
            onclick="closeAddEmployee()">

                İptal

            </button>


            <button
            class="saveEmployeeButton"
            onclick="saveNewEmployee()">

                Ekle

            </button>


        </div>


    </div>

</div>



<script>

/* ==================================================
   AY İSİMLERİ
================================================== */

const monthNames = [

    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"

];


/* ==================================================
   TARİH
================================================== */

let currentDate =
    new Date(2026,8,1);


/* ==================================================
   ÇALIŞANLAR
================================================== */

let employees = [];


/* ==================================================
   AKTİF ÇALIŞAN
================================================== */

let currentEmployee = null;


/* ==================================================
   VERİ YÜKLE
================================================== */

function loadData(){

    const saved =
        localStorage.getItem(
            "puantajEmployees"
        );

    if(saved){

        try{

            employees =
                JSON.parse(saved);

        }catch(error){

            employees = [];

        }

    }

    if(!Array.isArray(employees)){

        employees = [];

    }

    employees.forEach(employee => {

        if(!employee.months){

            employee.months = {};

        }

    });

}


/* ==================================================
   KAYDET
================================================== */

function saveData(){

    localStorage.setItem(

        "puantajEmployees",

        JSON.stringify(employees)

    );

}


/* ==================================================
   AY ANAHTARI
================================================== */

function getMonthKey(){

    return (

        currentDate.getFullYear()
        +
        "-"
        +
        String(
            currentDate.getMonth()+1
        ).padStart(2,"0")

    );

}


/* ==================================================
   AY VERİSİ
================================================== */

function getMonthData(){

    if(!currentEmployee.months){

        currentEmployee.months = {};

    }


    const key =
        getMonthKey();


    if(!currentEmployee.months[key]){

        currentEmployee.months[key] = {

            days:{},

            salary:0,

            received:0

        };

    }


    return currentEmployee.months[key];

}


/* ==================================================
   ÇALIŞAN İSİMLERİNİ GÖSTER
================================================== */

function renderEmployeeBar(){

    const bar =
        document.getElementById(
            "employeeBar"
        );


    bar.innerHTML = "";


    employees.forEach(employee => {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "employeeChip";


        if(
            currentEmployee &&
            employee.id ===
            currentEmployee.id
        ){

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            employee.name;


        button.onclick =
            function(){

                openEmployee(
                    employee.id
                );

            };


        bar.appendChild(button);


    });


    /* ÇALIŞAN EKLE */

    const add =
        document.createElement(
            "button"
        );


    add.className =
        "addEmployeeTop";


    add.textContent =
        "+";


    add.title =
        "Çalışan Ekle";


    add.onclick =
        function(){

            openAddEmployee();

        };


    bar.appendChild(add);

}


/* ==================================================
   ÇALIŞAN AÇ
================================================== */

function openEmployee(id){

    currentEmployee =
        employees.find(
            employee =>
            employee.id === id
        );


    if(!currentEmployee){

        return;

    }


    document.getElementById(
        "employeeName"
    ).textContent =
        currentEmployee.name;


    renderEmployeeBar();

    renderCalendar();

}


/* ==================================================
   TAKVİM
================================================== */

function renderCalendar(){

    if(!currentEmployee){

        return;

    }


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    document.getElementById(
        "monthName"
    ).textContent =

        monthNames[
            currentDate.getMonth()
        ]
        +
        " "
        +
        currentDate.getFullYear();


    const data =
        getMonthData();


    /* AYIN İLK GÜNÜ */

    let firstDay =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth(),

            1

        ).getDay();


    if(firstDay === 0){

        firstDay = 7;

    }


    /* AYIN GÜN SAYISI */

    const daysInMonth =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth()+1,

            0

        ).getDate();


    /* ÖNCEKİ AY */

    const previousMonthDays =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth(),

            0

        ).getDate();


    for(

        let i =
            firstDay - 1;

        i > 0;

        i--

    ){

        calendar.appendChild(

            createOtherDay(

                previousMonthDays-i+1

            )

        );

    }


    /* BU AY */

    for(

        let day=1;

        day<=daysInMonth;

        day++

    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const key =
            String(day);


        const dayData =
            data.days[key];


        /* DURUM */

        if(dayData){

            if(
                dayData.status ===
                "worked"
            ){

                cell.classList.add(
                    "worked"
                );

            }

            if(
                dayData.status ===
                "absent"
            ){

                cell.classList.add(
                    "absent"
                );

            }

            if(
                dayData.status ===
                "leave"
            ){

                cell.classList.add(
                    "leave"
                );

            }

            if(
                dayData.status ===
                "report"
            ){

                cell.classList.add(
                    "report"
                );

            }

            if(
                dayData.status ===
                "half"
            ){

                cell.classList.add(
                    "half"
                );

            }

        }


        /* NUMARA */

        const number =
            document.createElement(
                "div"
            );


        number.className =
            "dayNumber";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        /* BUGÜN */

        if(
            isToday(day)
        ){

            cell.classList.add(
                "today"
            );

        }


        /* DURUM YAZISI */

        if(dayData){

            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "status";


            if(
                dayData.status ===
                "worked"
            ){

                status.textContent =
                    "✓ Çalıştı";

                status.classList.add(
                    "workedStatus"
                );

            }

            else if(
                dayData.status ===
                "absent"
            ){

                status.textContent =
                    "✕ Gelmedi";

                status.classList.add(
                    "absentStatus"
                );

            }

            else if(
                dayData.status ===
                "leave"
            ){

                status.textContent =
                    "İzinli";

                status.classList.add(
                    "leaveStatus"
                );

            }

            else if(
                dayData.status ===
                "report"
            ){

                status.textContent =
                    "Raporlu";

                status.classList.add(
                    "reportStatus"
                );

            }

            else if(
                dayData.status ===
                "half"
            ){

                status.textContent =
                    "½ Gün";

                status.classList.add(
                    "halfStatus"
                );

            }


            cell.appendChild(
                status
            );

        }


        /* DOKUN */

        cell.onclick =
            function(){

                changeDayStatus(day);

            };


        calendar.appendChild(
            cell
        );

    }


    /* SONRAKİ AY */

    let nextDay = 1;


    while(
        calendar.children.length % 7 !== 0
    ){

        calendar.appendChild(

            createOtherDay(
                nextDay
            )

        );


        nextDay++;

    }


    updateSummary();

    updatePayment();

}


/* ==================================================
   DİĞER AY
================================================== */

function createOtherDay(day){

    const cell =
        document.createElement(
            "div"
        );


    cell.className =
        "day otherMonth";


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "dayNumber";


    number.textContent =
        day;


    cell.appendChild(
        number
    );


    return cell;

}


/* ==================================================
   DURUM DEĞİŞTİR
================================================== */

function changeDayStatus(day){

    const data =
        getMonthData();


    const key =
        String(day);


    const current =
        data.days[key]
        ?
        data.days[key].status
        :
        null;


    let next = null;


    if(current === null){

        next = "worked";

    }

    else if(
        current === "worked"
    ){

        next = "absent";

    }

    else if(
        current === "absent"
    ){

        next = "leave";

    }

    else if(
        current === "leave"
    ){

        next = "report";

    }

    else if(
        current === "report"
    ){

        next = "half";

    }

    else if(
        current === "half"
    ){

        next = null;

    }


    if(next === null){

        delete data.days[key];

    }

    else{

        let hours = 0;

        let wage = 0;


        if(next === "worked"){

            hours = 8;

            wage = 1;

        }


        if(next === "half"){

            hours = 4;

            wage = 0.5;

        }


        data.days[key] = {

            status:next,

            hours:hours,

            wage:wage

        };

    }


    saveData();

    renderCalendar();

}


/* ==================================================
   BUGÜN
================================================== */

function isToday(day){

    const today =
        new Date();


    return (

        today.getFullYear()
        ===
        currentDate.getFullYear()

        &&

        today.getMonth()
        ===
        currentDate.getMonth()

        &&

        today.getDate()
        ===
        day

    );

}


/* ==================================================
   AY DEĞİŞTİR
================================================== */

function changeMonth(amount){

    currentDate.setMonth(

        currentDate.getMonth()
        +
        amount

    );


    renderCalendar();

}


/* ==================================================
   ÖZET
================================================== */

function updateSummary(){

    const data =
        getMonthData();


    let worked = 0;

    let hours = 0;

    let wage = 0;

    let absent = 0;


    Object.values(
        data.days
    ).forEach(day => {


        if(
            day.status ===
            "worked"
        ){

            worked++;

            hours +=
                Number(
                    day.hours || 0
                );

            wage +=
                Number(
                    day.wage || 0
                );

        }


        else if(
            day.status ===
            "half"
        ){

            worked++;

            hours += 4;

            wage += 0.5;

        }


        else if(
            day.status ===
            "absent"
        ){

            absent++;

        }

    });


    document.getElementById(
        "worked"
    ).textContent =
        worked;


    document.getElementById(
        "hours"
    ).textContent =
        hours +
        " saat";


    document.getElementById(
        "wage"
    ).textContent =
        wage;


    document.getElementById(
        "absent"
    ).textContent =
        absent;

}


/* ==================================================
   ÖDEME
================================================== */

function updatePayment(){

    const data =
        getMonthData();


    document.getElementById(
        "salary"
    ).value =
        data.salary || "";


    document.getElementById(
        "received"
    ).value =
        data.received || "";


    const balance =

        Number(
            data.salary || 0
        )

        -

        Number(
            data.received || 0
        );


    document.getElementById(
        "balance"
    ).textContent =

        balance.toLocaleString(
            "tr-TR"
        )
        +
        " TL";

}


/* ==================================================
   ÖDEME DEĞİŞTİ
================================================== */

function paymentChanged(){

    const data =
        getMonthData();


    data.salary =
        Number(
            document.getElementById(
                "salary"
            ).value
        )
        ||
        0;


    data.received =
        Number(
            document.getElementById(
                "received"
            ).value
        )
        ||
        0;


    saveData();

    updatePayment();

}


/* ==================================================
   ÇALIŞAN EKLE PENCERESİNİ AÇ
================================================== */

function openAddEmployee(){

    document.getElementById(
        "addEmployeeModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "employeeNameInput"
    ).value = "";


    setTimeout(

        function(){

            document.getElementById(
                "employeeNameInput"
            ).focus();

        },

        100

    );

}


/* ==================================================
   PENCEREYİ KAPAT
================================================== */

function closeAddEmployee(){

    document.getElementById(
        "addEmployeeModal"
    ).classList.remove(
        "show"
    );

}


/* ==================================================
   YENİ ÇALIŞANI KAYDET
================================================== */

function saveNewEmployee(){

    const input =
        document.getElementById(
            "employeeNameInput"
        );


    const name =
        input.value.trim();


    if(!name){

        input.focus();

        return;

    }


    const newEmployee = {

        id:
            Date.now(),

        name:
            name,

        months:{}

    };


    employees.push(
        newEmployee
    );


    saveData();

    closeAddEmployee();


    /*
       Yeni eklenen çalışanı
       otomatik seç
    */

    openEmployee(
        newEmployee.id
    );

}


/* ==================================================
   ENTER İLE ÇALIŞAN EKLE
================================================== */

document.addEventListener(
    "keydown",

    function(event){

        if(
            event.key === "Enter"
            &&
            document
            .getElementById(
                "addEmployeeModal"
            )
            .classList
            .contains("show")
        ){

            saveNewEmployee();

        }


        if(
            event.key === "Escape"
            &&
            document
            .getElementById(
                "addEmployeeModal"
            )
            .classList
            .contains("show")
        ){

            closeAddEmployee();

        }

    }

);


/* ==================================================
   GERİ
================================================== */

function goBack(){

    window.location.href =
        "index.html";

}


/* ==================================================
   GÜVENLİ METİN
================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        );

}


/* ==================================================
   BAŞLAT
================================================== */

loadData();

if (employees.length > 0) {
    openEmployee(employees[0].id);
} else {
    currentEmployee = null;

    const nameElement =
        document.getElementById("employeeName");

    if (nameElement) {
        nameElement.textContent = "Çalışan Yok";
    }

    renderEmployeeBar();

    if (typeof renderCalendar === "function") {
        renderCalendar();
    }

    if (typeof renderSummary === "function") {
        renderSummary();
    }
}
