<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bireysel Puantaj</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#d8c7a5;
    color:#352e25;
}

/* =========================
   ÜST BAR
========================= */

.top{
    height:72px;
    background:#f5ecd8;
    border-bottom:1px solid #b8a984;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;
}

.back{
    width:44px;
    height:44px;

    border:0;
    background:transparent;

    font-size:38px;
    color:#40372b;
}

.title{
    text-align:center;
}

.title b{
    display:block;
    font-size:20px;
}

.title span{
    font-size:12px;
    color:#7b705e;
}

.people{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:#e5d7b8;

    font-size:21px;
}


/* =========================
   ANA
========================= */

.main{
    width:100%;
    max-width:760px;
    margin:auto;
}


/* =========================
   AY BAŞLIĞI
========================= */

.monthBar{
    padding:22px 15px 16px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.monthName{
    font-size:30px;
    font-weight:bold;
}

.monthButtons{
    display:flex;
    gap:8px;
}

.monthButtons button{
    width:45px;
    height:45px;

    border:1px solid #b6a47f;
    border-radius:12px;

    background:#eee2c6;

    color:#443b2e;

    font-size:28px;
}


/* =========================
   SEKME
========================= */

.tabs{
    margin:0 14px 17px;

    height:52px;

    border-radius:28px;

    background:#c7b58f;

    padding:4px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.tab{
    border:0;
    background:transparent;

    border-radius:25px;

    color:#665d4d;

    font-size:14px;
}

.tab.active{
    background:#f5ecd8;
    color:#30291f;
    font-weight:bold;

    box-shadow:0 2px 5px rgba(0,0,0,.12);
}


/* =========================
   HAFTA GÜNLERİ
========================= */

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);

    background:#e2d4b5;

    border-top:1px solid #b9a780;
    border-bottom:1px solid #b9a780;
}

.weekday{
    text-align:center;

    padding:11px 0;

    font-size:13px;
    font-weight:bold;

    color:#40382d;
}

.weekend{
    color:#817664;
}


/* =========================
   TAKVİM
========================= */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);

    background:#d5c39e;
}

.day{
    min-height:94px;

    background:#eee5d0;

    border-right:1px solid #c0ae8b;
    border-bottom:1px solid #c0ae8b;

    padding-top:8px;

    text-align:center;

    cursor:pointer;
}

.day:nth-child(7n+1){
    border-left:1px solid #c0ae8b;
}


/* Gün numarası */

.dayNumber{
    width:36px;
    height:36px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:18px;
    font-weight:bold;

    color:#3c3429;
}


/* Bugün */

.today .dayNumber{
    background:#d96742;
    color:white;
}


/* Önceki / sonraki ay */

.otherMonth{
    background:#ddd1b5;
    cursor:default;
}

.otherMonth .dayNumber{
    color:#9a8d76;
}


/* =========================
   DURUMLAR
========================= */

.status{
    margin-top:7px;

    font-size:13px;

    font-weight:bold;

    line-height:16px;
}


/* Çalıştı */

.worked{
    background:#dfead7;
}

.workedStatus{
    color:#4d894b;
}


/* Gelmedi */

.absent{
    background:#f0d8d5;
}

.absentStatus{
    color:#c44f49;
}


/* İzinli */

.leave{
    background:#e6dfce;
}

.leaveStatus{
    color:#776a51;
}


/* Raporlu */

.report{
    background:#e4d9eb;
}

.reportStatus{
    color:#755798;
}


/* Yarım gün */

.half{
    background:#f0e1c8;
}

.halfStatus{
    color:#b67530;
}


/* =========================
   KARTLAR
========================= */

.card{
    margin:16px 12px;

    background:#f0e6d0;

    border:1px solid #bcae91;

    border-radius:18px;

    padding:17px;

    box-shadow:
        0 3px 8px rgba(80,60,30,.08);
}

.cardTitle{
    font-size:21px;
    font-weight:bold;

    margin-bottom:13px;
}


/* =========================
   ÖZET
========================= */

.summaryGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:9px;
}

.box{
    background:#e3d5b7;

    border-radius:12px;

    padding:12px;
}

.box small{
    display:block;

    color:#786d5b;

    font-size:11px;

    margin-bottom:6px;
}

.box strong{
    font-size:18px;
}


/* =========================
   ÖDEME
========================= */

.paymentGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:9px;
}

.paymentBox{
    background:#e3d5b7;

    border-radius:12px;

    padding:12px;
}

.paymentBox label{
    display:block;

    color:#786d5b;

    font-size:11px;

    margin-bottom:6px;
}

.paymentBox input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#332d23;

    font-size:17px;
}

.balanceBox{
    grid-column:1 / 3;
}

.balance{
    font-size:19px;
    font-weight:bold;
}


/* =========================
   ÇALIŞAN LİSTESİ
========================= */

.employeeScreen{
    display:none;

    min-height:100vh;

    background:#d8c7a5;
}

.employeeList{
    padding:15px;
}

.employee{
    width:100%;

    margin-bottom:10px;

    border:1px solid #bbaa86;

    background:#eee4ce;

    border-radius:15px;

    padding:14px;

    display:flex;

    align-items:center;

    text-align:left;

    color:#332d23;
}

.avatar{
    width:48px;
    height:48px;

    border-radius:50%;

    background:#d0bf9d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    margin-right:12px;
}

.employeeInfo{
    flex:1;
}

.employeeInfo b{
    display:block;
    font-size:16px;
}

.employeeInfo span{
    display:block;

    margin-top:4px;

    color:#827664;

    font-size:12px;
}

.arrow{
    font-size:26px;
    color:#817460;
}

.addEmployee{
    display:block;

    margin:5px auto 30px;

    border:1px solid #aa9975;

    background:#eee4ce;

    color:#382f24;

    border-radius:12px;

    padding:13px 20px;

    font-weight:bold;
}


/* =========================
   TELEFON
========================= */

@media(max-width:500px){

    .monthName{
        font-size:28px;
    }

    .day{
        min-height:88px;
    }

    .dayNumber{
        width:33px;
        height:33px;

        font-size:17px;
    }

    .status{
        font-size:12px;
    }

}

</style>
</head>


<body>


<!-- =================================================
     TAKVİM EKRANI
================================================= -->

<div id="calendarScreen" class="main">


    <div class="top">

        <button
        class="back"
        onclick="goBack()">

            ‹

        </button>


        <div class="title">

            <b id="employeeName">
                Edip Tan
            </b>

            <span>
                Puantaj
            </span>

        </div>


        <button
        class="people"
        onclick="showEmployees()">

            👥

        </button>

    </div>


    <!-- AY -->

    <div class="monthBar">

        <div
        id="monthName"
        class="monthName">
        </div>


        <div class="monthButtons">

            <button onclick="changeMonth(-1)">
                ‹
            </button>

            <button onclick="changeMonth(1)">
                ›
            </button>

        </div>

    </div>


    <!-- GÖRÜNÜM -->

    <div class="tabs">

        <button class="tab">
            Yıl
        </button>

        <button class="tab active">
            Ay
        </button>

        <button class="tab">
            Hafta
        </button>

        <button class="tab">
            Gün
        </button>

    </div>


    <!-- HAFTA -->

    <div class="weekdays">

        <div class="weekday">
            PZT
        </div>

        <div class="weekday">
            SAL
        </div>

        <div class="weekday">
            ÇAR
        </div>

        <div class="weekday">
            PER
        </div>

        <div class="weekday">
            CUM
        </div>

        <div class="weekday weekend">
            CMT
        </div>

        <div class="weekday weekend">
            PAZ
        </div>

    </div>


    <!-- TAKVİM -->

    <div
    id="calendar"
    class="calendar">
    </div>


    <!-- AYLIK ÖZET -->

    <div class="card">

        <div class="cardTitle">
            Aylık Özet
        </div>


        <div class="summaryGrid">

            <div class="box">

                <small>
                    Çalışılan Gün
                </small>

                <strong id="worked">
                    0
                </strong>

            </div>


            <div class="box">

                <small>
                    Toplam Saat
                </small>

                <strong id="hours">
                    0 saat
                </strong>

            </div>


            <div class="box">

                <small>
                    Toplam Yevmiye
                </small>

                <strong id="wage">
                    0
                </strong>

            </div>


            <div class="box">

                <small>
                    Gelinmeyen Gün
                </small>

                <strong id="absent">
                    0
                </strong>

            </div>

        </div>

    </div>


    <!-- ÖDEME -->

    <div class="card">

        <div class="cardTitle">
            Aylık Ödeme
        </div>


        <div class="paymentGrid">


            <div class="paymentBox">

                <label>
                    Ücreti
                </label>

                <input
                id="salary"
                type="number"
                placeholder="0"
                oninput="paymentChanged()">

            </div>


            <div class="paymentBox">

                <label>
                    Alınan
                </label>

                <input
                id="received"
                type="number"
                placeholder="0"
                oninput="paymentChanged()">

            </div>


            <div class="paymentBox balanceBox">

                <label>
                    Kalan
                </label>

                <div
                id="balance"
                class="balance">

                    0 TL

                </div>

            </div>


        </div>

    </div>

</div>



<!-- =================================================
     ÇALIŞAN LİSTESİ
================================================= -->

<div
id="employeeScreen"
class="employeeScreen">


    <div class="top">

        <button
        class="back"
        onclick="goBack()">

            ‹

        </button>


        <div class="title">

            <b>
                Bireysel
            </b>

            <span>
                Çalışanlar
            </span>

        </div>

        <div style="width:44px"></div>

    </div>


    <div
    id="employeeList"
    class="employeeList">
    </div>


    <button
    class="addEmployee"
    onclick="addEmployee()">

        ＋ Çalışan Ekle

    </button>

</div>



<script>

/* =================================================
   AY İSİMLERİ
================================================= */

const monthNames = [

    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"

];


/* =================================================
   TARİH
================================================= */

let currentDate =
    new Date(2026,8,1);


/* =================================================
   ÇALIŞANLAR
================================================= */

let employees = [];


/* =================================================
   AKTİF ÇALIŞAN
================================================= */

let currentEmployee = null;


/* =================================================
   VERİLERİ YÜKLE
================================================= */

function loadData(){

    const saved =
        localStorage.getItem(
            "puantajEmployees"
        );


    if(saved){

        try{

            employees =
                JSON.parse(saved);

        }
        catch(error){

            employees = [];

        }

    }


    if(!Array.isArray(employees)){

        employees = [];

    }


    employees.forEach(employee => {

        if(!employee.months){

            employee.months = {};

        }

    });


    if(employees.length === 0){

        employees.push({

            id:1,

            name:"Edip Tan",

            months:{}

        });

    }


    saveData();

}


/* =================================================
   VERİ KAYDET
================================================= */

function saveData(){

    localStorage.setItem(

        "puantajEmployees",

        JSON.stringify(employees)

    );

}


/* =================================================
   AY ANAHTARI
================================================= */

function getMonthKey(){

    return (

        currentDate.getFullYear()
        +
        "-"
        +
        String(
            currentDate.getMonth()+1
        ).padStart(2,"0")

    );

}


/* =================================================
   AY VERİSİ
================================================= */

function getMonthData(){

    if(!currentEmployee.months){

        currentEmployee.months = {};

    }


    const key =
        getMonthKey();


    if(!currentEmployee.months[key]){

        currentEmployee.months[key] = {

            days:{},

            salary:0,

            received:0

        };

    }


    return currentEmployee.months[key];

}


/* =================================================
   TAKVİMİ OLUŞTUR
================================================= */

function renderCalendar(){

    if(!currentEmployee){

        return;

    }


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    /* AY BAŞLIĞI */

    document.getElementById(
        "monthName"
    ).textContent =

        monthNames[
            currentDate.getMonth()
        ]

        +
        " "
        +
        currentDate.getFullYear();


    const data =
        getMonthData();


    /* AYIN İLK GÜNÜ */

    let firstDay =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth(),

            1

        ).getDay();


    /*
       JavaScript:
       Pazar = 0

       Biz:
       Pazartesi = 1
    */

    if(firstDay === 0){

        firstDay = 7;

    }


    /* AYDAKİ GÜN SAYISI */

    const daysInMonth =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth()+1,

            0

        ).getDate();


    /* ÖNCEKİ AY */

    const previousMonthDays =
        new Date(

            currentDate.getFullYear(),

            currentDate.getMonth(),

            0

        ).getDate();


    for(
        let i = firstDay - 1;
        i > 0;
        i--
    ){

        const day =
            previousMonthDays - i + 1;


        calendar.appendChild(

            createOtherDay(day)

        );

    }


    /* BU AY */

    for(
        let day = 1;
        day <= daysInMonth;
        day++
    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const key =
            String(day);


        const dayData =
            data.days[key];


        /*
           DURUMA GÖRE RENK
        */

        if(dayData){

            if(
                dayData.status === "worked"
            ){

                cell.classList.add(
                    "worked"
                );

            }

            if(
                dayData.status === "absent"
            ){

                cell.classList.add(
                    "absent"
                );

            }

            if(
                dayData.status === "leave"
            ){

                cell.classList.add(
                    "leave"
                );

            }

            if(
                dayData.status === "report"
            ){

                cell.classList.add(
                    "report"
                );

            }

            if(
                dayData.status === "half"
            ){

                cell.classList.add(
                    "half"
                );

            }

        }


        /* NUMARA */

        const number =
            document.createElement(
                "div"
            );


        number.className =
            "dayNumber";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        /* BUGÜN */

        if(isToday(day)){

            cell.classList.add(
                "today"
            );

        }


        /* DURUM YAZISI */

        if(dayData){

            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "status";


            if(
                dayData.status === "worked"
            ){

                status.textContent =
                    "✓ Çalıştı";

                status.classList.add(
                    "workedStatus"
                );

            }

            else if(
                dayData.status === "absent"
            ){

                status.textContent =
                    "✕ Gelmedi";

                status.classList.add(
                    "absentStatus"
                );

            }

            else if(
                dayData.status === "leave"
            ){

                status.textContent =
                    "İzinli";

                status.classList.add(
                    "leaveStatus"
                );

            }

            else if(
                dayData.status === "report"
            ){

                status.textContent =
                    "Raporlu";

                status.classList.add(
                    "reportStatus"
                );

            }

            else if(
                dayData.status === "half"
            ){

                status.textContent =
                    "½ Gün";

                status.classList.add(
                    "halfStatus"
                );

            }


            cell.appendChild(
                status
            );

        }


        /*
           GÜNE BAS
        */

        cell.onclick = function(){

            changeDayStatus(day);

        };


        calendar.appendChild(
            cell
        );

    }


    /* SONRAKİ AY */

    let nextDay = 1;


    while(
        calendar.children.length % 7 !== 0
    ){

        calendar.appendChild(

            createOtherDay(
                nextDay
            )

        );


        nextDay++;

    }


    updateSummary();

    updatePayment();

}


/* =================================================
   DİĞER AY GÜNLERİ
================================================= */

function createOtherDay(day){

    const cell =
        document.createElement(
            "div"
        );


    cell.className =
        "day otherMonth";


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "dayNumber";


    number.textContent =
        day;


    cell.appendChild(
        number
    );


    return cell;

}


/* =================================================
   DURUM DEĞİŞTİR
================================================= */

function changeDayStatus(day){

    const data =
        getMonthData();


    const key =
        String(day);


    const current =
        data.days[key]
        ?
        data.days[key].status
        :
        null;


    let next = null;


    /*
       SIRASI:

       Boş
       ↓
       Çalıştı
       ↓
       Gelmedi
       ↓
       İzinli
       ↓
       Raporlu
       ↓
       ½ Gün
       ↓
       Boş
    */


    if(current === null){

        next = "worked";

    }

    else if(current === "worked"){

        next = "absent";

    }

    else if(current === "absent"){

        next = "leave";

    }

    else if(current === "leave"){

        next = "report";

    }

    else if(current === "report"){

        next = "half";

    }

    else if(current === "half"){

        next = null;

    }


    /* BOŞ */

    if(next === null){

        delete data.days[key];

    }

    else{

        let hours = 0;

        let wage = 0;


        if(next === "worked"){

            hours = 8;
            wage = 1;

        }

        else if(next === "half"){

            hours = 4;
            wage = 0.5;

        }


        data.days[key] = {

            status:next,

            hours:hours,

            wage:wage

        };

    }


    saveData();

    renderCalendar();

}


/* =================================================
   BUGÜN MÜ?
================================================= */

function isToday(day){

    const today =
        new Date();


    return (

        today.getFullYear()
        ===
        currentDate.getFullYear()

        &&

        today.getMonth()
        ===
        currentDate.getMonth()

        &&

        today.getDate()
        ===
        day

    );

}


/* =================================================
   AY DEĞİŞTİR
================================================= */

function changeMonth(amount){

    currentDate.setMonth(

        currentDate.getMonth()
        +
        amount

    );


    renderCalendar();

}


/* =================================================
   ÖZET
================================================= */

function updateSummary(){

    const data =
        getMonthData();


    let worked = 0;

    let hours = 0;

    let wage = 0;

    let absent = 0;


    Object.values(
        data.days
    ).forEach(day => {

        if(
            day.status === "worked"
        ){

            worked++;

            hours +=
                Number(
                    day.hours || 0
                );

            wage +=
                Number(
                    day.wage || 0
                );

        }


        else if(
            day.status === "half"
        ){

            worked++;

            hours += 4;

            wage += 0.5;

        }


        else if(
            day.status === "absent"
        ){

            absent++;

        }

    });


    document.getElementById(
        "worked"
    ).textContent =
        worked;


    document.getElementById(
        "hours"
    ).textContent =
        hours + " saat";


    document.getElementById(
        "wage"
    ).textContent =
        wage;


    document.getElementById(
        "absent"
    ).textContent =
        absent;

}


/* =================================================
   ÖDEME
================================================= */

function updatePayment(){

    const data =
        getMonthData();


    document.getElementById(
        "salary"
    ).value =
        data.salary || "";


    document.getElementById(
        "received"
    ).value =
        data.received || "";


    const balance =

        Number(
            data.salary || 0
        )

        -

        Number(
            data.received || 0
        );


    document.getElementById(
        "balance"
    ).textContent =

        balance.toLocaleString(
            "tr-TR"
        )
        +
        " TL";

}


/* =================================================
   ÖDEME DEĞİŞTİ
================================================= */

function paymentChanged(){

    const data =
        getMonthData();


    data.salary =
        Number(
            document.getElementById(
                "salary"
            ).value
        )
        ||
        0;


    data.received =
        Number(
            document.getElementById(
                "received"
            ).value
        )
        ||
        0;


    saveData();

    updatePayment();

}


/* =================================================
   ÇALIŞANLARI GÖSTER
================================================= */

function showEmployees(){

    document.getElementById(
        "calendarScreen"
    ).style.display =
        "none";


    document.getElementById(
        "employeeScreen"
    ).style.display =
        "block";


    const list =
        document.getElementById(
            "employeeList"
        );


    list.innerHTML = "";


    employees.forEach(employee => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "employee";


        button.innerHTML = `

            <div class="avatar">
                👤
            </div>

            <div class="employeeInfo">

                <b>
                    ${escapeHtml(employee.name)}
                </b>

                <span>
                    Aylık puantaj
                </span>

            </div>

            <div class="arrow">
                ›
            </div>

        `;


        button.onclick =
            function(){

                openEmployee(
                    employee.id
                );

            };


        list.appendChild(
            button
        );

    });

}


/* =================================================
   ÇALIŞAN AÇ
================================================= */

function openEmployee(id){

    currentEmployee =
        employees.find(
            employee =>
            employee.id === id
        );


    if(!currentEmployee){

        return;

    }


    document.getElementById(
        "employeeScreen"
    ).style.display =
        "none";


    document.getElementById(
        "calendarScreen"
    ).style.display =
        "block";


    document.getElementById(
        "employeeName"
    ).textContent =
        currentEmployee.name;


    renderCalendar();

}


/* =================================================
   ÇALIŞAN EKLE
================================================= */

function addEmployee(){

    const name =
        prompt(
            "Çalışanın adı ve soyadı:"
        );


    if(
        !name ||
        !name.trim()
    ){

        return;

    }


    employees.push({

        id:Date.now(),

        name:name.trim(),

        months:{}

    });


    saveData();

    showEmployees();

}


/* =================================================
   GERİ
================================================= */

function goBack(){

    if(
        employees.length > 1
    ){

        showEmployees();

    }
    else{

        window.location.href =
            "index.html";

    }

}


/* =================================================
   GÜVENLİ METİN
================================================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        );

}


/* =================================================
   BAŞLAT
================================================= */

loadData();


openEmployee(
    employees[0].id
);

</script>
