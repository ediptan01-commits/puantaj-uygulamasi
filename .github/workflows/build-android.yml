name: Puantaj - Bireysel ve Kurumsal APK ve AAB

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pro-restore-preparation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kaynak kodunu al
        uses: actions/checkout@v7

      - name: Ücretsiz özellikler ve PRO durum kontrolü
        run: |
          node --check kurumsal.js
          node --check pro-ui.js
          node --test tests/pro-ui.test.cjs
          node --test verification-service/test/*.test.mjs
          node tests/regression.cjs
          mkdir -p /tmp/puantaj-adpolicy
          javac -d /tmp/puantaj-adpolicy AdPolicy.java tests/AdPolicyTest.java
          java -cp /tmp/puantaj-adpolicy AdPolicyTest
          javac -d /tmp/puantaj-adpolicy PurchaseSignatureVerifier.java tests/PurchaseSignatureVerifierTest.java
          java -cp /tmp/puantaj-adpolicy PurchaseSignatureVerifierTest

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Android projesini hazırla
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

        run: |

          set -e

          echo "=== İMZA KONTROLÜ ==="

          if [[ -z "$SIGNING_KEY_BASE64" ]]; then
            echo "HATA: SIGNING_KEY_BASE64 bulunamadı!"
            echo "Release APK/AAB imzasız oluşturulmayacak."
            exit 1
          fi

          if [[ -z "$SIGNING_STORE_PASSWORD" ]]; then
            echo "HATA: SIGNING_STORE_PASSWORD bulunamadı!"
            exit 1
          fi

          if [[ -z "$SIGNING_KEY_ALIAS" ]]; then
            echo "HATA: SIGNING_KEY_ALIAS bulunamadı!"
            exit 1
          fi

          if [[ -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "HATA: SIGNING_KEY_PASSWORD bulunamadı!"
            exit 1
          fi

          echo "İmza Secret'ları mevcut."

          mkdir -p android/app/src/main/java/com/ediptan/kurumsalpuantaj
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          for required_file in index.html bireysel.html kurumsal.html kurumsal.css kurumsal.js assets/icon_puantaj.webp; do
            if [[ ! -s "$required_file" ]]; then
              echo "HATA: Gerekli dosya bulunamadı veya boş: $required_file"
              exit 1
            fi
          done

          echo "Bireysel ve Kurumsal güncel kaynaklar paketleniyor."
          cp index.html android/app/src/main/assets/
          cp kurumsal.html android/app/src/main/assets/
          cp kurumsal.css android/app/src/main/assets/
          cp kurumsal.js android/app/src/main/assets/
          cp bireysel.html android/app/src/main/assets/
          cp privacy.html android/app/src/main/assets/
          cp billing-config.json ads-config.json pro-ui.js android/app/src/main/assets/

          cp assets/icon_puantaj.webp \
            android/app/src/main/res/drawable/icon_puantaj.webp

          echo "Signing key hazırlanıyor..."

          echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/release-key.jks

          if [[ ! -s android/app/release-key.jks ]]; then
            echo "HATA: Signing key oluşturulamadı!"
            exit 1
          fi

          echo "Signing key başarıyla hazırlandı."

          # Match the signer of the existing v1.0.9 AAB; do not replace the upload key.
          keytool -J-Duser.language=en -list -v \
            -keystore android/app/release-key.jks \
            -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" \
            | grep -F "SHA256: EB:B7:EB:62:AB:C9:DA:75:5F:37:10:2A:C5:5C:CF:ED:D9:29:98:55:22:3E:CB:63:FA:46:DD:26:99:16:01:82"

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KurumsalPuantaj"

          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "9.1.1" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat >> android/gradle.properties <<EOF
          RELEASE_STORE_FILE=release-key.jks
          RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {

              namespace "com.ediptan.kurumsalpuantaj"

              compileSdk 36

              defaultConfig {

                  applicationId "com.ediptan.kurumsalpuantaj"

                  minSdk 24

                  targetSdk 36

                  manifestPlaceholders = [admobAppId: new groovy.json.JsonSlurper().parse(file("src/main/assets/ads-config.json")).appId]

                  versionCode 11

                  versionName "1.0.10"
              }

              signingConfigs {

                  release {
                      storeFile file(RELEASE_STORE_FILE)
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }

              buildTypes {

                  debug {
                      applicationIdSuffix ".debug"
                  }

                  release {

                      minifyEnabled false
                      shrinkResources false

                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "com.android.billingclient:billing:9.1.0"
              implementation "com.google.android.gms:play-services-ads:25.5.0"
              implementation "com.google.android.ump:user-messaging-platform:4.0.0"
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>

                  <item name="android:colorAccent">#1769ED</item>

                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>

              </style>

          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.android.vending.BILLING" />
              <application
                  android:allowBackup="true"
                  android:label="Puantaj"
                  android:icon="@drawable/icon_puantaj"
                  android:roundIcon="@drawable/icon_puantaj"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="${admobAppId}" />
                  <meta-data android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT" android:value="true" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:enableOnBackInvokedCallback="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cp MainActivity.java PlayBillingBridge.java AdvertisingController.java AdPolicy.java PurchaseSignatureVerifier.java android/app/src/main/java/com/ediptan/kurumsalpuantaj/

      - name: Temiz build
        working-directory: android
        run: |
          gradle --no-daemon clean

      - name: Debug APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Release APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Release AAB
        working-directory: android
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: İmzayı doğrula
        working-directory: android
        run: |
          echo "=== RELEASE APK İMZA KONTROLÜ ==="

          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "APK imzası geçerli."
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          keytool -J-Duser.language=en -printcert -jarfile app/build/outputs/bundle/release/app-release.aab \
            | grep -F "SHA256: EB:B7:EB:62:AB:C9:DA:75:5F:37:10:2A:C5:5C:CF:ED:D9:29:98:55:22:3E:CB:63:FA:46:DD:26:99:16:01:82"

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v6
        with:

          name: puantaj-android-v1.0.10

          if-no-files-found: error

          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

