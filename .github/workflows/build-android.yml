name: Puantaj - Bireysel ve Kurumsal APK ve AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kaynak kodunu al
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Android projesini hazırla
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

        run: |

          set -e

          echo "=== İMZA KONTROLÜ ==="

          if [[ -z "$SIGNING_KEY_BASE64" ]]; then
            echo "HATA: SIGNING_KEY_BASE64 bulunamadı!"
            echo "Release APK/AAB imzasız oluşturulmayacak."
            exit 1
          fi

          if [[ -z "$SIGNING_STORE_PASSWORD" ]]; then
            echo "HATA: SIGNING_STORE_PASSWORD bulunamadı!"
            exit 1
          fi

          if [[ -z "$SIGNING_KEY_ALIAS" ]]; then
            echo "HATA: SIGNING_KEY_ALIAS bulunamadı!"
            exit 1
          fi

          if [[ -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo "HATA: SIGNING_KEY_PASSWORD bulunamadı!"
            exit 1
          fi

          echo "İmza Secret'ları mevcut."

          mkdir -p android/app/src/main/java/com/ediptan/kurumsalpuantaj
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          for required_file in index.html bireysel.html kurumsal.html kurumsal.css kurumsal.js assets/icon_puantaj.webp; do
            if [[ ! -s "$required_file" ]]; then
              echo "HATA: Gerekli dosya bulunamadı veya boş: $required_file"
              exit 1
            fi
          done

          echo "Bireysel ve Kurumsal güncel kaynaklar paketleniyor."
          cp index.html android/app/src/main/assets/
          cp kurumsal.html android/app/src/main/assets/
          cp kurumsal.css android/app/src/main/assets/
          cp kurumsal.js android/app/src/main/assets/
          cp bireysel.html android/app/src/main/assets/
          cp privacy.html android/app/src/main/assets/

          cp assets/icon_puantaj.webp \
            android/app/src/main/res/drawable/icon_puantaj.webp

          echo "Signing key hazırlanıyor..."

          echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/release-key.jks

          if [[ ! -s android/app/release-key.jks ]]; then
            echo "HATA: Signing key oluşturulamadı!"
            exit 1
          fi

          echo "Signing key başarıyla hazırlandı."

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KurumsalPuantaj"

          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "9.1.1" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat >> android/gradle.properties <<EOF
          RELEASE_STORE_FILE=release-key.jks
          RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {

              namespace "com.ediptan.kurumsalpuantaj"

              compileSdk 36

              defaultConfig {

                  applicationId "com.ediptan.kurumsalpuantaj"

                  minSdk 24

                  targetSdk 36

                  versionCode 10

                  versionName "1.0.9"
              }

              signingConfigs {

                  release {
                      storeFile file(RELEASE_STORE_FILE)
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }

              buildTypes {

                  debug {
                      applicationIdSuffix ".debug"
                  }

                  release {

                      minifyEnabled false
                      shrinkResources false

                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies { }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>

                  <item name="android:colorAccent">#1769ED</item>

                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>

              </style>

          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Puantaj"
                  android:icon="@drawable/icon_puantaj"
                  android:roundIcon="@drawable/icon_puantaj"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:enableOnBackInvokedCallback="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cp MainActivity.java android/app/src/main/java/com/ediptan/kurumsalpuantaj/MainActivity.java

      - name: Temiz build
        working-directory: android
        run: |
          gradle --no-daemon clean

      - name: Debug APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Release APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Release AAB
        working-directory: android
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: İmzayı doğrula
        working-directory: android
        run: |
          echo "=== RELEASE APK İMZA KONTROLÜ ==="

          $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "APK imzası geçerli."

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v6
        with:

          name: puantaj-android-v1.0.9

          if-no-files-found: error

          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: GitHub sürümünü yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.9 \
            --target "$GITHUB_SHA" \
            --title "Puantaj 1.0.9 — Yedekleme ve sınırsız kullanım" \
            --notes-file RELEASE-NOTES.md \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab
