name: Kurumsal Puantaj - APK ve AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Android projesini hazırla
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/ediptan/kurumsalpuantaj
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets
          cp index.html kurumsal.html kurumsal.css kurumsal.js bireysel.html android/app/src/main/assets/
          cp assets/icon_puantaj.webp android/app/src/main/res/drawable/icon_puantaj.webp

          cat > android/settings.gradle <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KurumsalPuantaj"
          include(":app")
          GRADLE_SETTINGS

          cat > android/build.gradle <<'GRADLE_ROOT'
          plugins {
              id "com.android.application" version "9.1.1" apply false
          }
          GRADLE_ROOT

          cat > android/gradle.properties <<'GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GRADLE_PROPERTIES

          cat > android/app/build.gradle <<'GRADLE_APP'
          plugins { id "com.android.application" }
          android {
              namespace "com.ediptan.kurumsalpuantaj"
              compileSdk 36
              defaultConfig {
                  applicationId "com.ediptan.kurumsalpuantaj"
                  minSdk 23
                  targetSdk 36
                  versionCode 2
                  versionName "1.0.1"
              }
              buildTypes {
                  debug { applicationIdSuffix ".debug" }
                  release { minifyEnabled false; shrinkResources false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_APP

          cat > android/app/src/main/res/values/styles.xml <<'STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources> <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"> <item name="android:fontFamily">sans</item> <item name="android:colorAccent">#1769ED</item> <item name="android:navigationBarColor">#F2F5FB</item> <item name="android:statusBarColor">#F2F5FB</item> <item name="android:windowLightStatusBar">true</item> </style> </resources>
          STYLES

          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <application android:allowBackup="true" android:label="Kurumsal Puantaj" android:icon="@drawable/icon_puantaj" android:roundIcon="@drawable/icon_puantaj" android:supportsRtl="true" android:theme="@style/AppTheme"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application> </manifest>
          MANIFEST

          cp /dev/stdin android/app/src/main/java/com/ediptan/kurumsalpuantaj/MainActivity.java <<'JAVA'
          package com.ediptan.kurumsalpuantaj;

          import android.app.Activity;
          import android.graphics.Insets;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowInsets;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      webView.setOnApplyWindowInsetsListener((v, insets) -> {
                          Insets bars = insets.getInsets(WindowInsets.Type.systemBars());
                          v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                          return insets;
                      });
                  } else {
                      webView.setOnApplyWindowInsetsListener((v, insets) -> {
                          v.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),
                                  insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());
                          return insets;
                      });
                  }

                  setContentView(webView);
                  webView.requestApplyInsets();
                  webView.loadUrl("file:///android_asset/index.html");

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::handleBack);
                  }
              }

              private void handleBack() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  if (webView != null) {
                      String url = webView.getUrl();
                      if (url != null && (url.contains("bireysel.html") || url.contains("kurumsal.html"))) {
                          webView.loadUrl("file:///android_asset/index.html");
                          return;
                      }
                  }
                  finish();
              }

              @Override
              public void onBackPressed() {
                  handleBack();
              }
          }
          JAVA

      - name: Debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Release AAB
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: APK ve AAB dosyalarını yükle
        uses: actions/upload-artifact@v6
        with:
          name: kurumsal-puantaj-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
