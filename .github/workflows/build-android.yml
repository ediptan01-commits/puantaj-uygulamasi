

name: Puantaj - Bireysel ve Kurumsal APK ve AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Android projesini hazırla
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=== IMZA KONTROLU ==="

          for secret_name in \
            SIGNING_KEY_BASE64 \
            SIGNING_STORE_PASSWORD \
            SIGNING_KEY_ALIAS \
            SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "HATA: $secret_name bulunamadi!"
              exit 1
            fi
          done

          echo "Imza bilgileri mevcut."

          mkdir -p android/app/src/main/java/com/ediptan/kurumsalpuantaj
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets

          for required_file in \
            index.html \
            bireysel.html \
            kurumsal.html \
            kurumsal.css \
            kurumsal.js \
            privacy.html \
            onboarding.css \
            onboarding.js \
            MainActivity.java \
            assets/icon_puantaj.webp
          do
            if [[ ! -s "$required_file" ]]; then
              echo "HATA: Eksik veya bos dosya: $required_file"
              exit 1
            fi
          done

          echo "Bireysel ve Kurumsal kaynaklar paketleniyor."

          cp index.html android/app/src/main/assets/
          cp bireysel.html android/app/src/main/assets/
          cp kurumsal.html android/app/src/main/assets/
          cp kurumsal.css android/app/src/main/assets/
          cp kurumsal.js android/app/src/main/assets/
          cp privacy.html android/app/src/main/assets/
          cp onboarding.css android/app/src/main/assets/
          cp onboarding.js android/app/src/main/assets/

          cp assets/icon_puantaj.webp \
            android/app/src/main/res/drawable/icon_puantaj.webp

          echo "Signing key hazirlaniyor..."

          printf '%s' "$SIGNING_KEY_BASE64" | \
            base64 --decode > android/app/release-key.jks

          if [[ ! -s android/app/release-key.jks ]]; then
            echo "HATA: Signing key olusturulamadi!"
            exit 1
          fi

          echo "Signing key hazir."

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KurumsalPuantaj"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "9.1.1" apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          {
            printf 'RELEASE_STORE_FILE=release-key.jks\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } >> android/gradle.properties

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.ediptan.kurumsalpuantaj"

              compileSdk 36

              defaultConfig {
                  applicationId "com.ediptan.kurumsalpuantaj"
                  minSdk 24
                  targetSdk 36

                  versionCode 18
                  versionName "1.0.17"
              }

              signingConfigs {
                  release {
                      storeFile file(RELEASE_STORE_FILE)
                      storePassword RELEASE_STORE_PASSWORD
                      keyAlias RELEASE_KEY_ALIAS
                      keyPassword RELEASE_KEY_PASSWORD
                  }
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ".debug"
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "com.android.billingclient:billing:8.2.1"
              implementation "com.google.android.gms:play-services-ads:25.5.0"
              implementation "com.google.android.ump:user-messaging-platform:4.0.0"
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#1769ED</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="com.android.vending.BILLING" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Puantaj"
                  android:icon="@drawable/icon_puantaj"
                  android:roundIcon="@drawable/icon_puantaj"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-5866785474078079~5665135380" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:enableOnBackInvokedCallback="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cp MainActivity.java \
            android/app/src/main/java/com/ediptan/kurumsalpuantaj/MainActivity.java

      - name: Temiz build
        working-directory: android
        run: |
          gradle --no-daemon clean

      - name: Debug APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Release APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Release AAB
        working-directory: android
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: Imzayi dogrula
        working-directory: android
        run: |
          set -e

          echo "=== RELEASE APK IMZA KONTROLU ==="

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "APK imzasi gecerli."

      - name: APK ve AAB dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: puantaj-android-v1.0.17
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: GitHub surumunu yayinla
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="v1.0.17"

          FILES=(
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          )

          for file in "${FILES[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "HATA: Dosya bulunamadi: $file"
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release zaten mevcut."
            echo "APK ve AAB dosyalari guncelleniyor."

            gh release upload "$TAG" \
              "${FILES[@]}" \
              --clobber
          else
            echo "Yeni Release olusturuluyor."

            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Puantaj PRO 1.0.17 - Aylik ve Yillik Abonelik" \
              --generate-notes \
              "${FILES[@]}"
          fi

          echo "GitHub Release islemi tamamlandi."


