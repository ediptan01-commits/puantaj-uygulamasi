<!-- ==================================================
     KURUMSAL İNŞAAT MODÜLÜ
================================================== -->

<style>

.corpScreen{
    display:none;
    min-height:100vh;
    background:#f3f5f8;
    color:#172033;
}

.corpTop{
    height:68px;
    background:#ffffff;
    border-bottom:1px solid #e1e5eb;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:12px;
    position:sticky;
    top:0;
    z-index:100;
}

.corpBack{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#f0f2f5;
    color:#1d2939;
    font-size:28px;
    cursor:pointer;
}

.corpTitle{
    flex:1;
}

.corpTitle b{
    display:block;
    font-size:18px;
}

.corpTitle span{
    display:block;
    margin-top:2px;
    color:#667085;
    font-size:11px;
}

.corpContent{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:16px;
}

/* ŞİRKET */

.companyCard{
    background:#18263d;
    color:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 18px rgba(15,23,42,.12);
}

.companyLabel{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

.companyName{
    font-size:24px;
    font-weight:bold;
    margin-bottom:14px;
}

.companyInput{
    width:100%;
    height:45px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
    background:rgba(255,255,255,.1);
    color:white;
    padding:0 12px;
    outline:none;
    font-size:14px;
}

.companyInput::placeholder{
    color:rgba(255,255,255,.6);
}

/* İSTATİSTİKLER */

.corpStats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:16px;
}

.corpStat{
    background:white;
    border:1px solid #e4e7ec;
    border-radius:16px;
    padding:15px;
}

.corpStat small{
    display:block;
    color:#667085;
    font-size:11px;
    margin-bottom:7px;
}

.corpStat strong{
    font-size:24px;
    color:#18263d;
}

.corpStat.blue strong{
    color:#2563eb;
}

.corpStat.green strong{
    color:#16a34a;
}

.corpStat.red strong{
    color:#dc2626;
}

.corpStat.orange strong{
    color:#ea580c;
}

/* BÖLÜM */

.corpSection{
    background:white;
    border:1px solid #e4e7ec;
    border-radius:18px;
    margin-bottom:15px;
    overflow:hidden;
}

.corpSectionHead{
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eaecf0;
}

.corpSectionTitle{
    font-size:18px;
    font-weight:bold;
}

.corpAdd{
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    padding:9px 13px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.corpEmpty{
    padding:28px 18px;
    text-align:center;
    color:#667085;
    font-size:13px;
}

.corpEmptyIcon{
    font-size:35px;
    margin-bottom:8px;
}

/* ŞANTİYE */

.siteItem{
    padding:15px;
    border-bottom:1px solid #eaecf0;
    cursor:pointer;
}

.siteItem:last-child{
    border-bottom:0;
}

.siteItem:active{
    background:#f8fafc;
}

.siteTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.siteName{
    font-size:16px;
    font-weight:bold;
}

.siteArrow{
    color:#98a2b3;
    font-size:22px;
}

.siteInfo{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
}

.siteBadge{
    background:#f2f4f7;
    color:#475467;
    padding:5px 8px;
    border-radius:7px;
    font-size:10px;
}

/* EKİPLER */

.teamGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    padding:12px;
}

.teamCard{
    border:1px solid #e4e7ec;
    border-radius:14px;
    padding:13px;
    background:#fafbfc;
    cursor:pointer;
}

.teamIcon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#e8f0ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    margin-bottom:9px;
}

.teamName{
    font-weight:bold;
    font-size:14px;
}

.teamMeta{
    color:#667085;
    font-size:10px;
    margin-top:5px;
}

/* BUGÜN */

.todayList{
    padding:5px 15px 10px;
}

.todayRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eaecf0;
}

.todayRow:last-child{
    border-bottom:0;
}

.todayTeam{
    font-size:14px;
    font-weight:bold;
}

.todayCount{
    font-size:12px;
    color:#667085;
}

.todayStatus{
    padding:6px 9px;
    border-radius:8px;
    background:#ecfdf3;
    color:#027a48;
    font-size:10px;
    font-weight:bold;
}

/* HIZLI MENÜ */

.quickGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
    padding:12px;
}

.quickButton{
    border:1px solid #e4e7ec;
    background:#fff;
    border-radius:13px;
    padding:15px;
    text-align:left;
    cursor:pointer;
}

.quickIcon{
    font-size:23px;
    margin-bottom:8px;
}

.quickButton b{
    display:block;
    font-size:13px;
}

.quickButton span{
    display:block;
    margin-top:3px;
    color:#667085;
    font-size:10px;
}

/* MODAL */

.corpModal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:99999;
}

.corpModal.show{
    display:flex;
}

.corpModalBox{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:20px;
    padding:20px;
}

.corpModalTitle{
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}

.corpField{
    margin-bottom:12px;
}

.corpField label{
    display:block;
    font-size:11px;
    color:#667085;
    margin-bottom:5px;
}

.corpField input,
.corpField select{
    width:100%;
    height:46px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    padding:0 12px;
    font-size:14px;
    outline:none;
    background:white;
}

.corpModalButtons{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.corpModalButtons button{
    flex:1;
    height:45px;
    border:0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.corpCancel{
    background:#f2f4f7;
    color:#344054;
}

.corpSave{
    background:#2563eb;
    color:white;
}

/* TELEFON */

@media(max-width:600px){

    .corpContent{
        padding:10px;
    }

    .companyCard{
        padding:17px;
        border-radius:17px;
    }

    .companyName{
        font-size:21px;
    }

    .corpStats{
        gap:7px;
    }

    .corpStat{
        padding:12px;
    }

    .corpStat strong{
        font-size:21px;
    }

    .teamGrid{
        grid-template-columns:1fr 1fr;
    }

}

</style>


<!-- ==================================================

================================================== -->

<!-- ==================================================
     KURUMSAL MODAL
================================================== -->

<div
id="corporateModal"
class="corpModal">

    <div class="corpModalBox">

        <div
        id="corpModalTitle"
        class="corpModalTitle">
            Yeni Şantiye
        </div>


        <div class="corpField">

            <label>
                Ad
            </label>

            <input
            id="corpModalName"
            type="text"
            placeholder="Adını yazın">

        </div>


        <div
        id="corpTeamSelectArea"
        class="corpField"
        style="display:none;">

            <label>
                Ekip
            </label>

            <select id="corpWorkerTeam">
            </select>

        </div>


        <div class="corpModalButtons">

            <button
            class="corpCancel"
            onclick="closeCorporateModal()">
                İptal
            </button>

            <button
            class="corpSave"
            onclick="saveCorporateModal()">
                Kaydet
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   KURUMSAL VERİ
================================================== */

let corporateData = {

    companyName:"",

    sites:[],

    teams:[],

    workers:[]

};


let corporateModalType = null;


/* ==================================================
   KURUMSAL VERİ YÜKLE
================================================== */

function loadCorporateData(){

    const saved =
        localStorage.getItem(
            "puantajCorporateData"
        );

    if(saved){

        try{

            corporateData =
                JSON.parse(saved);

        }catch(error){

            corporateData = {
                companyName:"",
                sites:[],
                teams:[],
                workers:[]
            };

        }

    }

    if(!corporateData.sites)
        corporateData.sites=[];

    if(!corporateData.teams)
        corporateData.teams=[];

    if(!corporateData.workers)
        corporateData.workers=[];

}


/* ==================================================
   KAYDET
================================================== */

function saveCorporateData(){

    localStorage.setItem(
        "puantajCorporateData",
        JSON.stringify(corporateData)
    );

}


/* ==================================================
   KURUMSALI AÇ
================================================== */

function openCorporate(){

    const calendarScreen =
        document.getElementById(
            "calendarScreen"
        );

    const corporateScreen =
        document.getElementById(
            "corporateScreen"
        );

    if(calendarScreen)
        calendarScreen.style.display="none";

    if(corporateScreen)
        corporateScreen.style.display="block";

    loadCorporateData();

    renderCorporate();

}


/* ==================================================
   KURUMSALI KAPAT
================================================== */

function closeCorporate(){

    const corporateScreen =
        document.getElementById(
            "corporateScreen"
        );

    const calendarScreen =
        document.getElementById(
            "calendarScreen"
        );

    if(corporateScreen)
        corporateScreen.style.display="none";

    if(calendarScreen)
        calendarScreen.style.display="block";

}


/* ==================================================
   ŞİRKET ADI
================================================== */

function saveCorporateCompany(){

    const input =
        document.getElementById(
            "corpCompanyInput"
        );

    const name =
        input.value.trim();

    corporateData.companyName =
        name;

    saveCorporateData();

    renderCorporate();

}


/* ==================================================
   RENDER
================================================== */

function renderCorporate(){

    const companyName =
        corporateData.companyName ||
        "Şirket Adı";

    document.getElementById(
        "corpCompanyName"
    ).textContent =
        companyName;

    document.getElementById(
        "corpCompanyInput"
    ).value =
        corporateData.companyName || "";


    document.getElementById(
        "corpSiteCount"
    ).textContent =
        corporateData.sites.length;


    document.getElementById(
        "corpTeamCount"
    ).textContent =
        corporateData.teams.length;


    document.getElementById(
        "corpWorkerCount"
    ).textContent =
        corporateData.workers.length;


    document.getElementById(
        "corpTodayCount"
    ).textContent =
        corporateData.workers.length;


    renderCorporateSites();

    renderCorporateTeams();

    renderCorporateToday();

}


/* ==================================================
   ŞANTİYELER
================================================== */

function renderCorporateSites(){

    const box =
        document.getElementById(
            "corpSites"
        );

    if(corporateData.sites.length===0){

        box.innerHTML = `
            <div class="corpEmpty">

                <div class="corpEmptyIcon">
                    🏗️
                </div>

                Henüz şantiye eklenmedi.

                <br>

                Yukarıdaki
                <b>+ Şantiye</b>
                butonundan ekleyebilirsiniz.

            </div>
        `;

        return;

    }


    box.innerHTML =
        corporateData.sites.map(site => {

            const teamCount =
                corporateData.teams.filter(
                    team =>
                    team.siteId === site.id
                ).length;

            return `

                <div
                class="siteItem">

                    <div class="siteTop">

                        <div class="siteName">
                            ${escapeCorporate(site.name)}
                        </div>

                        <div class="siteArrow">
                            ›
                        </div>

                    </div>

                    <div class="siteInfo">

                        <div class="siteBadge">
                            ${teamCount} ekip
                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* ==================================================
   EKİPLER
================================================== */

function renderCorporateTeams(){

    const box =
        document.getElementById(
            "corpTeams"
        );


    if(corporateData.teams.length===0){

        box.innerHTML = `

            <div
            class="corpEmpty"
            style="grid-column:1/3;">

                <div class="corpEmptyIcon">
                    👷
                </div>

                Henüz ekip eklenmedi.

            </div>

        `;

        return;

    }


    box.innerHTML =
        corporateData.teams.map(team => {

            const count =
                corporateData.workers.filter(
                    worker =>
                    worker.teamId === team.id
                ).length;

            return `

                <div
                class="teamCard">

                    <div class="teamIcon">
                        👷
                    </div>

                    <div class="teamName">
                        ${escapeCorporate(team.name)}
                    </div>

                    <div class="teamMeta">
                        ${count} çalışan
                    </div>

                </div>

            `;

        }).join("");

}


/* ==================================================
   BUGÜN
================================================== */

function renderCorporateToday(){

    const box =
        document.getElementById(
            "corpToday"
        );


    if(corporateData.teams.length===0){

        box.innerHTML = `

            <div class="corpEmpty">

                Bugünkü puantajı görmek için
                önce ekip ekleyin.

            </div>

        `;

        return;

    }


    box.innerHTML=
  corporateData.teams.map(team => {

            const count =
                corporateData.workers.filter(
                    worker =>
                    worker.teamId === team.id
                ).length;

            return `

                <div class="todayRow">

                    <div>

                        <div class="todayTeam">
                            ${escapeCorporate(team.name)}
                        </div>

                        <div class="todayCount">
                            ${count} çalışan
                        </div>

                    </div>

                    <div class="todayStatus">
                        ${count} kişi
                    </div>

                </div>

            `;

        }).join("");

}


/* ==================================================
   MODAL AÇ
================================================== */

function openCorporateModal(type){

    corporateModalType =
        type;

    const modal =
        document.getElementById(
            "corporateModal"
        );

    const title =
        document.getElementById(
            "corpModalTitle"
        );

    const input =
        document.getElementById(
            "corpModalName"
        );

    const teamArea =
        document.getElementById(
            "corpTeamSelectArea"
        );


    input.value="";

    teamArea.style.display="none";


    if(type==="site"){

        title.textContent =
            "Yeni Şantiye";

        input.placeholder =
            "Örn: Nilüfer Konut Projesi";

    }


    if(type==="team"){

        title.textContent =
            "Yeni Ekip";

        input.placeholder =
            "Örn: Kalıpçı Ekibi";

    }


    if(type==="worker"){

        title.textContent =
            "Yeni Çalışan";

        input.placeholder =
            "Ad Soyad";

        teamArea.style.display =
            "block";

        renderWorkerTeamSelect();

    }


    modal.classList.add("show");

    setTimeout(() => {
        input.focus();
    },100);

}


/* ==================================================
   EKİP SEÇİMİ
================================================== */

function renderWorkerTeamSelect(){

    const select =
        document.getElementById(
            "corpWorkerTeam"
        );

    if(corporateData.teams.length===0){

        select.innerHTML =
            `<option value="">
                Önce ekip ekleyin
            </option>`;

        return;

    }


    select.innerHTML =
        corporateData.teams.map(team => {

            return `
                <option value="${team.id}">
                    ${escapeCorporate(team.name)}
                </option>
            `;

        }).join("");

}


/* ==================================================
   MODAL KAYDET
================================================== */

function saveCorporateModal(){

    const input =
        document.getElementById(
            "corpModalName"
        );

    const name =
        input.value.trim();


    if(!name){

        alert("Lütfen bir isim girin.");

        return;

    }


    if(corporateModalType==="site"){

        corporateData.sites.push({

            id:
            "site_" +
            Date.now(),

            name:name

        });

    }


    if(corporateModalType==="team"){

        corporateData.teams.push({

            id:
            "team_" +
            Date.now(),

            name:name,

            siteId:
            corporateData.sites.length
            ?
            corporateData.sites[0].id
            :
            null

        });

    }


    if(corporateModalType==="worker"){

        const teamId =
            document.getElementById(
                "corpWorkerTeam"
            ).value;

        if(!teamId){

            alert(
                "Önce bir ekip oluşturun."
            );

            return;

        }


        corporateData.workers.push({

            id:
            "worker_" +
            Date.now(),

            name:name,

            teamId:teamId,

            status:"worked"

        });

    }


    saveCorporateData();

    closeCorporateModal();

    renderCorporate();

}


/* ==================================================
   MODAL KAPAT
================================================== */

function closeCorporateModal(){

    document
    .getElementById(
        "corporateModal"
    )
    .classList.remove("show");

    corporateModalType=null;

}


/* ==================================================
   YAKINDA
================================================== */

function corporateComingSoon(name){

    alert(
        name +
        " modülünü bir sonraki aşamada ekleyeceğiz."
    );

}


/* ==================================================
   GÜVENLİ METİN
================================================== */

function escapeCorporate(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==================================================
   KURUMSAL VERİYİ HAZIRLA
================================================== */

loadCorporateData();

</script>
