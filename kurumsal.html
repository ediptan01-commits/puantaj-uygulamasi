<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kurumsal Puantaj</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#172033;
}

/* ÜST BAR */

.top{
    height:68px;
    background:#ffffff;
    border-bottom:1px solid #e1e5eb;

    display:flex;
    align-items:center;

    padding:0 15px;
    gap:12px;
}

.back{
    width:42px;
    height:42px;

    border:0;
    border-radius:12px;

    background:#eef1f5;

    font-size:28px;
    color:#172033;
}

.title{
    flex:1;
}

.title b{
    display:block;
    font-size:19px;
}

.title span{
    display:block;
    margin-top:3px;

    color:#667085;
    font-size:11px;
}


/* ANA */

.main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}


/* ŞİRKET */

.company{
    background:#17263d;
    color:white;

    border-radius:20px;

    padding:20px;

    margin-bottom:15px;
}

.company small{
    display:block;

    font-size:11px;
    opacity:.65;

    margin-bottom:5px;
}

.company h1{
    font-size:25px;
    margin-bottom:15px;
}

.company input{
    width:100%;
    height:45px;

    border:1px solid
    rgba(255,255,255,.2);

    border-radius:10px;

    background:
    rgba(255,255,255,.1);

    color:white;

    padding:0 12px;

    outline:none;

    font-size:14px;
}


/* İSTATİSTİK */

.stats{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}

.stat{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:16px;

    padding:15px;
}

.stat small{

    display:block;

    color:#667085;

    font-size:11px;

    margin-bottom:7px;
}

.stat strong{

    font-size:25px;

}


/* KART */

.card{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:18px;

    margin-bottom:15px;

    overflow:hidden;
}

.cardHead{

    min-height:58px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 15px;

    border-bottom:1px solid #eaecf0;
}

.cardTitle{

    font-size:18px;

    font-weight:bold;
}

.add{

    border:0;

    background:#2563eb;

    color:white;

    border-radius:9px;

    padding:9px 12px;

    font-size:12px;

    font-weight:bold;
}


/* BOŞ */

.empty{

    text-align:center;

    color:#667085;

    padding:30px 15px;

    font-size:13px;
}

.emptyIcon{

    font-size:35px;

    margin-bottom:8px;
}


/* ŞANTİYE */

.site{

    padding:15px;

    border-bottom:
    1px solid #eaecf0;
}

.site:last-child{

    border-bottom:0;
}

.siteName{

    font-size:16px;

    font-weight:bold;
}

.siteInfo{

    display:flex;

    gap:7px;

    margin-top:7px;
}

.badge{

    background:#f2f4f7;

    color:#475467;

    border-radius:7px;

    padding:5px 8px;

    font-size:10px;
}


/* EKİP */

.teams{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    padding:12px;
}

.team{

    border:1px solid #e4e7ec;

    background:#fafbfc;

    border-radius:14px;

    padding:13px;
}

.teamIcon{

    width:40px;
    height:40px;

    border-radius:11px;

    background:#e8f0ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    margin-bottom:9px;
}

.teamName{

    font-size:14px;

    font-weight:bold;
}

.teamCount{

    margin-top:5px;

    color:#667085;

    font-size:10px;
}


/* HIZLI MENÜ */

.quick{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    padding:12px;
}

.quick button{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:13px;

    padding:15px;

    text-align:left;
}

.quickIcon{

    font-size:23px;

    margin-bottom:8px;
}

.quick b{

    display:block;

    font-size:13px;
}

.quick span{

    display:block;

    color:#667085;

    font-size:10px;

    margin-top:4px;
}


/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(15,23,42,.5);

    display:none;

    align-items:center;

    justify-content:center;

    padding:18px;

    z-index:9999;
}

.modal.show{

    display:flex;
}

.modalBox{

    width:100%;

    max-width:390px;

    background:white;

    border-radius:20px;

    padding:20px;
}

.modalTitle{

    font-size:21px;

    font-weight:bold;

    margin-bottom:15px;
}

.field{

    margin-bottom:13px;
}

.field label{

    display:block;

    color:#667085;

    font-size:11px;

    margin-bottom:5px;
}

.field input,
.field select{

    width:100%;

    height:46px;

    border:1px solid #d0d5dd;

    border-radius:10px;

    padding:0 12px;

    font-size:14px;

    outline:none;
}

.buttons{

    display:flex;

    gap:8px;

    margin-top:18px;
}

.buttons button{

    flex:1;

    height:45px;

    border:0;

    border-radius:10px;

    font-weight:bold;
}

.cancel{

    background:#f2f4f7;

    color:#344054;
}

.save{

    background:#2563eb;

    color:white;
}


/* TELEFON */

@media(max-width:600px){

    .main{

        padding:10px;
    }

    .company{

        padding:17px;

        border-radius:17px;
    }

    .company h1{

        font-size:21px;
    }

    .stat{

        padding:12px;
    }

    .stat strong{

        font-size:21px;
    }

}

    /* ==================================================
   EKİP DETAY
================================================== */

.teamDetail{
    display:none;
    min-height:100vh;
    background:#f3f5f8;
}

.teamDetailTop{
    height:68px;
    background:white;
    border-bottom:1px solid #e1e5eb;

    display:flex;
    align-items:center;

    padding:0 15px;
    gap:12px;
}

.teamBack{
    width:42px;
    height:42px;

    border:0;
    border-radius:12px;

    background:#eef1f5;

    font-size:28px;
}

.teamDetailTop b{
    display:block;
    font-size:18px;
}

.teamDetailTop span{
    display:block;
    color:#667085;
    font-size:11px;
    margin-top:3px;
}

.teamDetailContent{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.attendanceStats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.attendanceStats div{
    background:white;
    border:1px solid #e4e7ec;
    border-radius:13px;
    padding:11px;
    text-align:center;
}

.attendanceStats small{
    display:block;
    color:#667085;
    font-size:10px;
    margin-bottom:5px;
}

.attendanceStats strong{
    font-size:20px;
}

.dateBox{
    background:#17263d;
    color:white;
    border-radius:16px;
    padding:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.dateBox button{
    width:38px;
    height:38px;

    border:0;
    border-radius:10px;

    background:rgba(255,255,255,.12);
    color:white;

    font-size:24px;
}

.dateBox div{
    text-align:center;
}

.dateBox small{
    display:block;
    font-size:9px;
    opacity:.6;
    margin-bottom:4px;
}

.dateBox b{
    font-size:16px;
}

.workerSection{
    background:white;
    border:1px solid #e4e7ec;
    border-radius:18px;
    overflow:hidden;
}

.workerHead{
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 15px;

    border-bottom:1px solid #eaecf0;
}

.workerHead b{
    font-size:18px;
}

.workerHead button{
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    padding:9px 12px;
    font-weight:bold;
}

.workerRow{
    padding:13px 15px;
    border-bottom:1px solid #eaecf0;
}

.workerRow:last-child{
    border-bottom:0;
}

.workerName{
    font-size:15px;
    font-weight:bold;
    margin-bottom:9px;
}

.statusButtons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.statusButtons button{
    border:1px solid #d0d5dd;
    background:#f8fafc;
    border-radius:8px;
    padding:7px 3px;
    font-size:9px;
    color:#475467;
}

.statusButtons button.active{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.noWorkers{
    padding:30px 15px;
    text-align:center;
    color:#667085;
    font-size:13px;
}

@media(max-width:600px){

    .attendanceStats{
        grid-template-columns:repeat(2,1fr);
    }

    .statusButtons{
        grid-template-columns:repeat(5,1fr);
    }

    .statusButtons button{
        font-size:8px;
        padding:8px 1px;
    }

}
    
</style>

</head>


<body>


<!-- ÜST -->

<div class="top">

    <button
class="back"
onclick="location.href='index.html'">

        ‹

    </button>

    <div class="title">

        <b>Kurumsal Puantaj</b>

        <span>
            İnşaat • Şantiye • Ekip Yönetimi
        </span>

    </div>

</div>


<div class="main">


<!-- ŞİRKET -->

<div class="company">

    <small>
        ŞİRKET
    </small>

    <h1 id="companyName">
        Şirket Adı
    </h1>

    <input
    id="companyInput"
    type="text"
    placeholder="Şirket adını yazın"
    onchange="saveCompany()">

</div>


<!-- İSTATİSTİKLER -->

<div class="stats">

    <div class="stat">

        <small>
            ŞANTİYE
        </small>

        <strong id="siteCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            EKİP
        </small>

        <strong id="teamCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            ÇALIŞAN
        </small>

        <strong id="workerCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            BUGÜN ÇALIŞAN
        </small>

        <strong id="todayCount">
            0
        </strong>

    </div>

</div>


<!-- ŞANTİYELER -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            🏗️ Şantiyeler
        </div>

        <button
        class="add"
        onclick="openModal('site')">

            + Şantiye

        </button>

    </div>

    <div id="sites"></div>

</div>


<!-- EKİPLER -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            👷 Ekipler
        </div>

        <button
        class="add"
        onclick="openModal('team')">

            + Ekip

        </button>

    </div>

    <div
    id="teams"
    class="teams">

    </div>

</div>


<!-- YÖNETİM -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            Yönetim
        </div>

    </div>


    <div class="quick">

        <button
        onclick="openModal('worker')">

            <div class="quickIcon">
                👷
            </div>

            <b>
                Çalışan Ekle
            </b>

            <span>
                Ekibe çalışan ekle
            </span>

        </button>


        <button
    onclick="openModal('payment')">

    <div class="quickIcon">
        💰
    </div>

    <b>
        Ödemeler
    </b>

    <span>
        Avans ve ödemeler
    </span>

        </button>


        <button
    onclick="alert('Raporlar modülünü bir sonraki aşamada ekleyeceğiz.')"
>

    <div class="quickIcon">
        📄
    </div>

    <div>
        <b>Raporlar</b>
        <span>Puantaj raporları</span>
    </div>

        </button>

    </div>

</div>


</div>


<!-- MODAL -->

    <!-- ==================================================
     EKİP DETAY
================================================== -->

<div
id="teamDetail"
class="teamDetail">

    <div class="teamDetailTop">

        <button
        class="teamBack"
        onclick="closeTeam()">

            ‹

        </button>

        <div>

            <b id="detailTeamName">
                Ekip
            </b>

            <span id="detailSiteName">
                Şantiye
            </span>

        </div>

    </div>


    <div class="teamDetailContent">


        <!-- ÖZET -->

        <div class="attendanceStats">

            <div>
                <small>Çalıştı</small>
                <strong id="workedCount">0</strong>
            </div>

            <div>
                <small>Gelmedi</small>
                <strong id="absentCount">0</strong>
            </div>

            <div>
                <small>İzinli</small>
                <strong id="leaveCount">0</strong>
            </div>

            <div>
                <small>Raporlu</small>
                <strong id="reportCount">0</strong>
            </div>

        </div>


        <!-- TARİH -->

        <div class="dateBox">

            <button
            onclick="changeTeamDate(-1)">
                ‹
            </button>

            <div>

                <small>PUANTAJ TARİHİ</small>

                <b id="teamDate">
                    30 Eylül 2026
                </b>

            </div>

            <button
            onclick="changeTeamDate(1)">
                ›
            </button>

        </div>


        <!-- ÇALIŞANLAR -->

        <div class="workerSection">

            <div class="workerHead">

                <b>Çalışanlar</b>

                <button
                onclick="openModal('worker')">

                    + Çalışan

                </button>

            </div>

            <div id="teamWorkers">
            </div>

        </div>

    </div>

</div>

<div
id="modal"
class="modal">

    <div class="modalBox">

        <div
        id="modalTitle"
        class="modalTitle">

            Yeni Şantiye

        </div>


        <div class="field">

            <label>
                Ad
            </label>

            <input
            id="modalName"
            type="text"
            placeholder="Ad">

        </div>


        <div
        id="teamSelectBox"
        class="field"
        style="display:none;">

            <div class="field">

    <label>
        Görevi
    </label>

    <input
    id="workerRole"
    type="text"
    placeholder="Örn: Kalıp Ustası">

</div>


<div class="field">

    <label>
        Telefon
    </label>

    <input
    id="workerPhone"
    type="tel"
    placeholder="05XX XXX XX XX">

</div>


<div class="field">

    <label>
        Günlük Yevmiye (TL)
    </label>

    <input
    id="workerWage"
    type="number"
    placeholder="Örn: 2000">

</div>

            <label>
                Ekip
            </label>

            <select
            id="workerTeam">
            </select>

        </div>

        <div id="paymentFields" style="display:none;">

    <div class="field">
        <label>Çalışan</label>
        <select id="paymentWorker">
        </select>
    </div>

    <div class="field">
        <label>Ödeme Türü</label>
        <select id="paymentType">
            <option value="wage">Maaş / Yevmiye</option>
            <option value="advance">Avans</option>
        </select>
    </div>

    <div class="field">
        <label>Ödeme Tutarı (TL)</label>
        <input
            id="paymentAmount"
            type="number"
            placeholder="Örn: 5000"
        >
    </div>

    <div class="field">
        <label>Açıklama</label>
        <input
            id="paymentNote"
            type="text"
            placeholder="Örn: Haftalık ödeme"
        >
    </div>

        </div>


        <div class="buttons">

            <button
            class="cancel"
            onclick="closeModal()">

                İptal

            </button>

            <button
            class="save"
            onclick="saveModal()">

                Kaydet

            </button>

        </div>

    </div>

</div>


<script>

/* VERİ */

let data = {

    company:"",

    sites:[],

    teams:[],

    workers:[],

    payments:[]

};

let modalType="";


/* YÜKLE */

function loadData(){

    const saved =
        localStorage.getItem(
            "kurumsalPuantaj"
        );

    if(saved){

        try{

            data=JSON.parse(saved);

        }catch(e){

            data={
                company:"",
                sites:[],
                teams:[],
                workers:[],
                payments:[]
            };

        }

    }

    if(!Array.isArray(data.payments)){

    data.payments=[];

    }

}


/* KAYDET */

function saveData(){

    localStorage.setItem(

        "kurumsalPuantaj",

        JSON.stringify(data)

    );

}


/* ŞİRKET */

function saveCompany(){

    data.company =
        document
        .getElementById("companyInput")
        .value
        .trim();

    saveData();

    render();

}


/* MODAL */

function openModal(type){

    modalType=type;

    document
    .getElementById("modal")
    .classList.add("show");

    const title =
        document
        .getElementById("modalTitle");

    const input =
        document
        .getElementById("modalName");

    const teamBox =
        document
        .getElementById("teamSelectBox");

    teamBox.style.display="none";

    input.value="";


    if(type==="site"){

        title.textContent=
            "Yeni Şantiye";

        input.placeholder=
            "Örn: Nilüfer Konut Projesi";

    }


    if(type==="team"){

        title.textContent=
            "Yeni Ekip";

        input.placeholder=
            "Örn: Kalıpçı Ekibi";

    }


    if(type==="worker"){

    
    title.textContent =
        "Yeni Çalışan";

    input.placeholder =
        "Ad Soyad";

    teamBox.style.display =
        "block";

    document.getElementById(
        "workerRole"
    ).value = "";

    document.getElementById(
        "workerPhone"
    ).value = "";

    document.getElementById(
        "workerWage"
    ).value = "";

    renderTeamSelect();

    }

    if(type==="payment"){

    title.textContent =
    "Yeni Ödeme";

    input.placeholder =
    "Ödeme tutarı";

    teamBox.style.display =
    "none";

        document.getElementById(
    "paymentFields"
).style.display = "block";

        renderPaymentWorkers();

    }


    input.focus();

}

    /* ÖDEME ÇALIŞANLARI */

function renderPaymentWorkers(){

    const select =
        document.getElementById("paymentWorker");

    if(!select) return;

    select.innerHTML = "";

    data.workers.forEach(worker => {

        const option =
            document.createElement("option");

        option.value = worker.id;

        option.textContent =
            worker.name;

        select.appendChild(option);

    });

}


/* EKİP SEÇ */

function renderTeamSelect(){

    const select =
        document
        .getElementById("workerTeam");

    if(data.teams.length===0){

        select.innerHTML=
            `<option>
                Önce ekip ekleyin
            </option>`;

        return;

    }


    select.innerHTML=
        data.teams.map(team=>`

            <option value="${team.id}">
                ${team.name}
            </option>

        `).join("");

}


/* KAYDET */

function saveModal(){

    const name =
        document
        .getElementById("modalName")
        .value
        .trim();

    if(modalType==="payment"){

    const workerId =
        document.getElementById("paymentWorker").value;

    const type =
        document.getElementById("paymentType").value;

    const amount =
        Number(
            document.getElementById("paymentAmount").value
        );

    const note =
        document.getElementById("paymentNote").value.trim();

    if(!workerId){
        alert("Lütfen çalışan seçin.");
        return;
    }

    if(!amount || amount <= 0){
        alert("Lütfen geçerli bir ödeme tutarı girin.");
        return;
    }

    data.payments.push({

        id:
        "payment_" + Date.now(),

        workerId:
        workerId,

        type:
        type,

        amount:
        amount,

        note:
        note,

        date:
        new Date().toISOString()

    });

    saveData();

    closeModal();

    render();

    return;
    }

    if(!name){

        alert("Lütfen isim girin.");

        return;

    }


    if(modalType==="site"){

        data.sites.push({

            id:
            "site_"+Date.now(),

            name:name

        });

    }


    if(modalType==="team"){

        data.teams.push({

            id:
            "team_"+Date.now(),

            name:name,

            siteId:
            data.sites.length
            ?
            data.sites[0].id
            :
            null

        });

    }


   
if(modalType==="worker"){

    const team =
        document
        .getElementById("workerTeam")
        .value;

    const role =
        document
        .getElementById("workerRole")
        .value
        .trim();

    const phone =
        document
        .getElementById("workerPhone")
        .value
        .trim();

    const wage =
        Number(
            document
            .getElementById("workerWage")
            .value
        ) || 0;


    if(!team){

        alert(
            "Önce bir ekip seçin."
        );

        return;

    }


    data.workers.push({

        id:
        "worker_"+Date.now(),

        name:name,

        role:role,

        phone:phone,

        dailyWage:wage,

        teamId:team,

        status:"worked",

        attendance:{}

    });

}


    saveData();

    closeModal();

    render();

}


/* KAPAT */

function closeModal(){

    document
    .getElementById("modal")
    .classList.remove("show");

}

    .getElementById("siteCount")
    .textContent=
        data.sites.length;


    document
    .getElementById("teamCount")
    .textContent=
        data.teams.length;


    document
    .getElementById("workerCount")
    .textContent=
        data.workers.length;


    document
    .getElementById("todayCount")
    .textContent=
        data.workers.length;

    renderTeams();

}

    /* ==================================================
   EKİP DETAY SİSTEMİ
================================================== */

let currentTeamId = null;

let teamDate =
    new Date();


/* EKİBİ AÇ */

function openTeam(teamId){

    currentTeamId =
        teamId;

    const team =
        data.teams.find(
            t => t.id === teamId
        );

    if(!team)
        return;


    document
    .querySelector(".main")
    .style.display="none";


    document
    .getElementById("teamDetail")
    .style.display="block";


    document
    .getElementById("detailTeamName")
    .textContent =
        team.name;


    const site =
        data.sites.find(
            s => s.id === team.siteId
        );


    document
    .getElementById("detailSiteName")
    .textContent =
        site
        ? site.name
        : "Şantiye belirtilmedi";


    renderTeamDetail();

}


/* EKİBİ KAPAT */

function closeTeam(){

    document
    .getElementById("teamDetail")
    .style.display="none";


    document
    .querySelector(".main")
    .style.display="block";

    currentTeamId=null;

}


/* TARİH */

function formatTeamDate(){

    const months=[
        "Ocak",
        "Şubat",
        "Mart",
        "Nisan",
        "Mayıs",
        "Haziran",
        "Temmuz",
        "Ağustos",
        "Eylül",
        "Ekim",
        "Kasım",
        "Aralık"
    ];

    return (

        teamDate.getDate()
        +
        " "
        +
        months[
            teamDate.getMonth()
        ]
        +
        " "
        +
        teamDate.getFullYear()

    );

}


function getTeamDateKey(){

    return (

        teamDate.getFullYear()
        +
        "-"
        +
        String(
            teamDate.getMonth()+1
        ).padStart(2,"0")
        +
        "-"
        +
        String(
            teamDate.getDate()
        ).padStart(2,"0")

    );

}


function changeTeamDate(amount){

    teamDate.setDate(
        teamDate.getDate()+amount
    );

    renderTeamDetail();

}


/* DURUM */

function getWorkerStatus(worker){

    if(!worker.attendance)
        worker.attendance={};

    return (

        worker.attendance[
            getTeamDateKey()
        ]
        ||
        "worked"

    );

}


/* DURUM DEĞİŞTİR */

function setWorkerStatus(
    workerId,
    status
){

    const worker =
        data.workers.find(
            w => w.id === workerId
        );

    if(!worker)
        return;


    if(!worker.attendance)
        worker.attendance={};


    worker.attendance[
        getTeamDateKey()
    ] =
        status;


    saveData();

    renderTeamDetail();

}


/* EKİP EKRANI */

function renderTeamDetail(){

    const team =
        data.teams.find(
            t => t.id === currentTeamId
        );

    if(!team)
        return;


    document
    .getElementById("teamDate")
    .textContent =
        formatTeamDate();


    const workers =
        data.workers.filter(
            w =>
            w.teamId ===
            currentTeamId
        );


    let worked=0;
    let absent=0;
    let leave=0;
    let report=0;


    workers.forEach(worker=>{

        const status =
            getWorkerStatus(worker);


        if(status==="worked")
            worked++;

        if(status==="absent")
            absent++;

        if(status==="leave")
            leave++;

        if(status==="report")
            report++;

    });


    document
    .getElementById("workedCount")
    .textContent=worked;


    document
    .getElementById("absentCount")
    .textContent=absent;


    document
    .getElementById("leaveCount")
    .textContent=leave;


    document
    .getElementById("reportCount")
    .textContent=report;


    const box =
        document
        .getElementById("teamWorkers");


    if(workers.length===0){

        box.innerHTML=`

            <div class="noWorkers">

                Bu ekipte henüz çalışan yok.

                <br><br>

                <button
                onclick="openModal('worker')"
                style="
                border:0;
                background:#2563eb;
                color:white;
                border-radius:9px;
                padding:10px 14px;
                font-weight:bold;
                ">

                    + İlk Çalışanı Ekle

                </button>

            </div>

        `;

        return;

    }


    box.innerHTML =
        workers.map(worker=>{

            const status =
                getWorkerStatus(worker);


            return `

                <div class="workerRow">

                    <div class="workerName">

                        ${worker.name}

                    </div>


                    <div class="statusButtons">


                        <button
                        class="${
                            status==="worked"
                            ? "active"
                            : ""
                        }"
                        onclick="
                        setWorkerStatus(
                            '${worker.id}',
                            'worked'
                        )">

                            ✓ Çalıştı

                        </button>


                        <button
                        class="${
                            status==="absent"
                            ? "active"
                            : ""
                        }"
                        onclick="
                        setWorkerStatus(
                            '${worker.id}',
                            'absent'
                        )">

                            ✕ Gelmedi

                        </button>


                        <button
                        class="${
                            status==="leave"
                            ? "active"
                            : ""
                        }"
                        onclick="
                        setWorkerStatus(
                            '${worker.id}',
                            'leave'
                        )">

                            İzinli

                        </button>


                        <button
                        class="${
                            status==="report"
                            ? "active"
                            : ""
                        }"
                        onclick="
                        setWorkerStatus(
                            '${worker.id}',
                            'report'
                        )">

                            Raporlu

                        </button>


                        <button
                        class="${
                            status==="half"
                            ? "active"
                            : ""
                        }"
                        onclick="
                        setWorkerStatus(
                            '${worker.id}',
                            'half'
                        )">

                            ½ Gün

                        </button>


                    </div>

                </div>

            `;

        }).join("");

}

/* BAŞLAT */

loadData();

render();

</script>
