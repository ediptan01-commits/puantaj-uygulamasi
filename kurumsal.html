<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kurumsal Puantaj</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#172033;
}

/* ÜST BAR */

.top{
    height:68px;
    background:#ffffff;
    border-bottom:1px solid #e1e5eb;

    display:flex;
    align-items:center;

    padding:0 15px;
    gap:12px;
}

.back{
    width:42px;
    height:42px;

    border:0;
    border-radius:12px;

    background:#eef1f5;

    font-size:28px;
    color:#172033;
}

.title{
    flex:1;
}

.title b{
    display:block;
    font-size:19px;
}

.title span{
    display:block;
    margin-top:3px;

    color:#667085;
    font-size:11px;
}


/* ANA */

.main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}


/* ŞİRKET */

.company{
    background:#17263d;
    color:white;

    border-radius:20px;

    padding:20px;

    margin-bottom:15px;
}

.company small{
    display:block;

    font-size:11px;
    opacity:.65;

    margin-bottom:5px;
}

.company h1{
    font-size:25px;
    margin-bottom:15px;
}

.company input{
    width:100%;
    height:45px;

    border:1px solid
    rgba(255,255,255,.2);

    border-radius:10px;

    background:
    rgba(255,255,255,.1);

    color:white;

    padding:0 12px;

    outline:none;

    font-size:14px;
}


/* İSTATİSTİK */

.stats{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}

.stat{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:16px;

    padding:15px;
}

.stat small{

    display:block;

    color:#667085;

    font-size:11px;

    margin-bottom:7px;
}

.stat strong{

    font-size:25px;

}


/* KART */

.card{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:18px;

    margin-bottom:15px;

    overflow:hidden;
}

.cardHead{

    min-height:58px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 15px;

    border-bottom:1px solid #eaecf0;
}

.cardTitle{

    font-size:18px;

    font-weight:bold;
}

.add{

    border:0;

    background:#2563eb;

    color:white;

    border-radius:9px;

    padding:9px 12px;

    font-size:12px;

    font-weight:bold;
}


/* BOŞ */

.empty{

    text-align:center;

    color:#667085;

    padding:30px 15px;

    font-size:13px;
}

.emptyIcon{

    font-size:35px;

    margin-bottom:8px;
}


/* ŞANTİYE */

.site{

    padding:15px;

    border-bottom:
    1px solid #eaecf0;
}

.site:last-child{

    border-bottom:0;
}

.siteName{

    font-size:16px;

    font-weight:bold;
}

.siteInfo{

    display:flex;

    gap:7px;

    margin-top:7px;
}

.badge{

    background:#f2f4f7;

    color:#475467;

    border-radius:7px;

    padding:5px 8px;

    font-size:10px;
}


/* EKİP */

.teams{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    padding:12px;
}

.team{

    border:1px solid #e4e7ec;

    background:#fafbfc;

    border-radius:14px;

    padding:13px;
}

.teamIcon{

    width:40px;
    height:40px;

    border-radius:11px;

    background:#e8f0ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    margin-bottom:9px;
}

.teamName{

    font-size:14px;

    font-weight:bold;
}

.teamCount{

    margin-top:5px;

    color:#667085;

    font-size:10px;
}


/* HIZLI MENÜ */

.quick{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    padding:12px;
}

.quick button{

    background:white;

    border:1px solid #e4e7ec;

    border-radius:13px;

    padding:15px;

    text-align:left;
}

.quickIcon{

    font-size:23px;

    margin-bottom:8px;
}

.quick b{

    display:block;

    font-size:13px;
}

.quick span{

    display:block;

    color:#667085;

    font-size:10px;

    margin-top:4px;
}


/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(15,23,42,.5);

    display:none;

    align-items:center;

    justify-content:center;

    padding:18px;

    z-index:9999;
}

.modal.show{

    display:flex;
}

.modalBox{

    width:100%;

    max-width:390px;

    background:white;

    border-radius:20px;

    padding:20px;
}

.modalTitle{

    font-size:21px;

    font-weight:bold;

    margin-bottom:15px;
}

.field{

    margin-bottom:13px;
}

.field label{

    display:block;

    color:#667085;

    font-size:11px;

    margin-bottom:5px;
}

.field input,
.field select{

    width:100%;

    height:46px;

    border:1px solid #d0d5dd;

    border-radius:10px;

    padding:0 12px;

    font-size:14px;

    outline:none;
}

.buttons{

    display:flex;

    gap:8px;

    margin-top:18px;
}

.buttons button{

    flex:1;

    height:45px;

    border:0;

    border-radius:10px;

    font-weight:bold;
}

.cancel{

    background:#f2f4f7;

    color:#344054;
}

.save{

    background:#2563eb;

    color:white;
}


/* TELEFON */

@media(max-width:600px){

    .main{

        padding:10px;
    }

    .company{

        padding:17px;

        border-radius:17px;
    }

    .company h1{

        font-size:21px;
    }

    .stat{

        padding:12px;
    }

    .stat strong{

        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- ÜST -->

<div class="top">

    <button
    class="back"
    onclick="history.back()">

        ‹

    </button>

    <div class="title">

        <b>Kurumsal Puantaj</b>

        <span>
            İnşaat • Şantiye • Ekip Yönetimi
        </span>

    </div>

</div>


<div class="main">


<!-- ŞİRKET -->

<div class="company">

    <small>
        ŞİRKET
    </small>

    <h1 id="companyName">
        Şirket Adı
    </h1>

    <input
    id="companyInput"
    type="text"
    placeholder="Şirket adını yazın"
    onchange="saveCompany()">

</div>


<!-- İSTATİSTİKLER -->

<div class="stats">

    <div class="stat">

        <small>
            ŞANTİYE
        </small>

        <strong id="siteCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            EKİP
        </small>

        <strong id="teamCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            ÇALIŞAN
        </small>

        <strong id="workerCount">
            0
        </strong>

    </div>

    <div class="stat">

        <small>
            BUGÜN ÇALIŞAN
        </small>

        <strong id="todayCount">
            0
        </strong>

    </div>

</div>


<!-- ŞANTİYELER -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            🏗️ Şantiyeler
        </div>

        <button
        class="add"
        onclick="openModal('site')">

            + Şantiye

        </button>

    </div>

    <div id="sites"></div>

</div>


<!-- EKİPLER -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            👷 Ekipler
        </div>

        <button
        class="add"
        onclick="openModal('team')">

            + Ekip

        </button>

    </div>

    <div
    id="teams"
    class="teams">

    </div>

</div>


<!-- YÖNETİM -->

<div class="card">

    <div class="cardHead">

        <div class="cardTitle">
            Yönetim
        </div>

    </div>


    <div class="quick">

        <button
        onclick="openModal('worker')">

            <div class="quickIcon">
                👷
            </div>

            <b>
                Çalışan Ekle
            </b>

            <span>
                Ekibe çalışan ekle
            </span>

        </button>


        <button
        onclick="alert('Ödeme modülünü bir sonraki aşamada ekleyeceğiz.')">

            <div class="quickIcon">
                💰
            </div>

            <b>
                Ödemeler
            </b>

            <span>
                Avans ve ödemeler
            </span>

        </button>


        <button
        onclick="alert('Hakediş modülünü bir sonraki aşamada ekleyeceğiz.')">

            <div class="quickIcon">
                📊
            </div>

            <b>
                Hakediş
            </b>

            <span>
                Metraj ve iş takibi
            </span>

        </button>


        <button
        onclick="alert('Rapor modülünü bir sonraki aşamada ekleyeceğiz.')">

            <div class="quickIcon">
                📄
            </div>

            <b>
                Raporlar
            </b>

            <span>
                Puantaj raporları
            </span>

        </button>

    </div>

</div>


</div>


<!-- MODAL -->

<div
id="modal"
class="modal">

    <div class="modalBox">

        <div
        id="modalTitle"
        class="modalTitle">

            Yeni Şantiye

        </div>


        <div class="field">

            <label>
                Ad
            </label>

            <input
            id="modalName"
            type="text"
            placeholder="Ad">

        </div>


        <div
        id="teamSelectBox"
        class="field"
        style="display:none;">

            <label>
                Ekip
            </label>

            <select
            id="workerTeam">
            </select>

        </div>


        <div class="buttons">

            <button
            class="cancel"
            onclick="closeModal()">

                İptal

            </button>

            <button
            class="save"
            onclick="saveModal()">

                Kaydet

            </button>

        </div>

    </div>

</div>


<script>

/* VERİ */

let data = {

    company:"",

    sites:[],

    teams:[],

    workers:[]

};

let modalType="";


/* YÜKLE */

function loadData(){

    const saved =
        localStorage.getItem(
            "kurumsalPuantaj"
        );

    if(saved){

        try{

            data=JSON.parse(saved);

        }catch(e){

            data={
                company:"",
                sites:[],
                teams:[],
                workers:[]
            };

        }

    }

}


/* KAYDET */

function saveData(){

    localStorage.setItem(

        "kurumsalPuantaj",

        JSON.stringify(data)

    );

}


/* ŞİRKET */

function saveCompany(){

    data.company =
        document
        .getElementById("companyInput")
        .value
        .trim();

    saveData();

    render();

}


/* MODAL */

function openModal(type){

    modalType=type;

    document
    .getElementById("modal")
    .classList.add("show");

    const title =
        document
        .getElementById("modalTitle");

    const input =
        document
        .getElementById("modalName");

    const teamBox =
        document
        .getElementById("teamSelectBox");

    teamBox.style.display="none";

    input.value="";


    if(type==="site"){

        title.textContent=
            "Yeni Şantiye";

        input.placeholder=
            "Örn: Nilüfer Konut Projesi";

    }


    if(type==="team"){

        title.textContent=
            "Yeni Ekip";

        input.placeholder=
            "Örn: Kalıpçı Ekibi";

    }


    if(type==="worker"){

        title.textContent=
            "Yeni Çalışan";

        input.placeholder=
            "Ad Soyad";

        teamBox.style.display=
            "block";

        renderTeamSelect();

    }


    input.focus();

}


/* EKİP SEÇ */

function renderTeamSelect(){

    const select =
        document
        .getElementById("workerTeam");

    if(data.teams.length===0){

        select.innerHTML=
            `<option>
                Önce ekip ekleyin
            </option>`;

        return;

    }


    select.innerHTML=
        data.teams.map(team=>`

            <option value="${team.id}">
                ${team.name}
            </option>

        `).join("");

}


/* KAYDET */

function saveModal(){

    const name =
        document
        .getElementById("modalName")
        .value
        .trim();

    if(!name){

        alert("Lütfen isim girin.");

        return;

    }


    if(modalType==="site"){

        data.sites.push({

            id:
            "site_"+Date.now(),

            name:name

        });

    }


    if(modalType==="team"){

        data.teams.push({

            id:
            "team_"+Date.now(),

            name:name,

            siteId:
            data.sites.length
            ?
            data.sites[0].id
            :
            null

        });

    }


    if(modalType==="worker"){

        const team =
            document
            .getElementById("workerTeam")
            .value;

        if(!team){

            alert("Önce ekip ekleyin.");

            return;

        }

        data.workers.push({

            id:
            "worker_"+Date.now(),

            name:name,

            teamId:team,

            status:"worked"

        });

    }


    saveData();

    closeModal();

    render();

}


/* KAPAT */

function closeModal(){

    document
    .getElementById("modal")
    .classList.remove("show");

}


/* RENDER */

function render(){

    document
    .getElementById("companyName")
    .textContent=
        data.company ||
        "Şirket Adı";


    document
    .getElementById("companyInput")
    .value=
        data.company || "";


    document
    .getElementById("siteCount")
    .textContent=
        data.sites.length;


    document
    .getElementById("teamCount")
    .textContent=
        data.teams.length;


    document
    .getElementById("workerCount")
    .textContent=
        data.workers.length;


    document
    .getElementById("todayCount")
    .textContent=
        data.workers.length;


    renderSites();

    renderTeams();

}


/* ŞANTİYELER */

function renderSites(){

    const box=
        document
        .getElementById("sites");


    if(data.sites.length===0){

        box.innerHTML=`

            <div class="empty">

                <div class="emptyIcon">
                    🏗️
                </div>

                Henüz şantiye eklenmedi.

            </div>

        `;

        return;

    }


    box.innerHTML=
        data.sites.map(site=>`

            <div class="site">

                <div class="siteName">
                    ${site.name}
                </div>

                <div class="siteInfo">

                    <div class="badge">

                        ${
                            data.teams.filter(
                                t =>
                                t.siteId===
                                site.id
                            ).length
                        }

                        ekip

                    </div>

                </div>

            </div>

        `).join("");

}


/* EKİPLER */

function renderTeams(){

    const box=
        document
        .getElementById("teams");


    if(data.teams.length===0){

        box.innerHTML=`

            <div
            class="empty"
            style="grid-column:1/3;">

                <div class="emptyIcon">
                    👷
                </div>

                Henüz ekip eklenmedi.

            </div>

        `;

        return;

    }


    box.innerHTML=
        data.teams.map(team=>`

            <div class="team">

                <div class="teamIcon">
                    👷
                </div>

                <div class="teamName">
                    ${team.name}
                </div>

                <div class="teamCount">

                    ${
                        data.workers.filter(
                            w =>
                            w.teamId===
                            team.id
                        ).length
                    }

                    çalışan

                </div>

            </div>

        `).join("");

}


/* BAŞLAT */

loadData();

render();

</script>

</body>

</html>
